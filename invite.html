<script>
/* =====================================================================
   STORE — the single source the views render from.

   Every view reads STORE.events. Those objects are shaped exactly like a
   Firestore event document, so the same rendering code serves both modes:

     mode 'live'   onSnapshot streams docs straight in
     mode 'local'  the hardcoded SEED array is mapped into the same shape,
                   so the page still works before Firebase is configured
   ===================================================================== */
var STORE = {
  events: [],
  byId: {},
  mode: "local",
  ready: false,
  error: null,
  subs: [],

  onChange: function(fn){ this.subs.push(fn); },
  notify: function(){ this.subs.forEach(function(f){ try{ f(); }catch(e){ console.error(e); } }); },

  setEvents: function(list, mode){
    this.events = list.sort(function(a,b){
      return a.dateISO === b.dateISO ? a.timeSort - b.timeSort : (a.dateISO < b.dateISO ? -1 : 1);
    });
    this.byId = {};
    var self = this;
    this.events.forEach(function(e){
      self.byId[e.id] = e;
      if(e.slug && !self.byId[e.slug]) self.byId[e.slug] = e;   // slug links keep working
    });
    if(mode) this.mode = mode;
    this.ready = true;
    this.notify();
  },

  /* Merge subcollection payloads onto one event, then repaint. */
  setDetail: function(id, patch){
    var ev = this.byId[id];
    if(!ev) return;
    for(var k in patch) ev[k] = patch[k];
    this.notify();
  }
};

/* ================= WHO IS LOOKING AT THIS =================
   Every visitor gets a random uid the first time the page loads, kept in
   localStorage so a returning visitor is the same person. The profile
   (name / phone / photo) hangs off that uid; a matching phone number pulls
   several uids together into one account. The registry keeps every profile
   this browser has seen so linking works offline; live mode mirrors the
   profile into Firestore under visitors/{uid}.
   ========================================================= */
var ME_KEY = 'd2c.me.v1', REG_KEY = 'd2c.visitors.v1', ME = null;
var repaintMe = function(){}, promptVerify = function(){};

function newUid(){
  var a = new Uint8Array(8), i, s = '';
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 256);
  for(i = 0; i < 8; i++) s += ('0' + a[i].toString(16)).slice(-2);
  return 'u-' + s;
}
function loadMe(){
  if(ME) return ME;
  try{ ME = JSON.parse(localStorage.getItem(ME_KEY) || 'null'); }catch(e){}
  if(!ME || !ME.uid){
    ME = { uid: newUid(), name: '', phone: '', photo: '', verifiedPhone: '', events: [], claims: {}, rsvp: {}, linked: [], cloudLinked: [] };
    try{ localStorage.setItem(ME_KEY, JSON.stringify(ME)); }catch(e){}
  }
  if(!Array.isArray(ME.events)) ME.events = [];
  if(!Array.isArray(ME.linked)) ME.linked = [];
  if(!Array.isArray(ME.cloudLinked)) ME.cloudLinked = [];
  if(!ME.claims || typeof ME.claims !== 'object') ME.claims = {};
  if(!ME.rsvp || typeof ME.rsvp !== 'object') ME.rsvp = {};
  if(typeof ME.verifiedPhone !== 'string') ME.verifiedPhone = '';
  if(!ME.plus || typeof ME.plus !== 'object') ME.plus = {};
  return ME;
}
function meAvatar(){ var m = loadMe(); return m.photo || GAV; }
function normPhone(p){ return String(p || '').replace(/\D/g, '').slice(-10); }
function regAll(){
  try{ return JSON.parse(localStorage.getItem(REG_KEY) || '{}') || {}; }catch(e){ return {}; }
}
/* every OTHER uid that carries my phone number, verified or not */
function phoneMatches(){
  var m = loadMe(), mine = normPhone(m.phone);
  if(!mine) return [];
  var reg = regAll(), out = [], k;
  for(k in reg) if(k !== m.uid && normPhone(reg[k].phone) === mine) out.push(reg[k]);
  (m.cloudLinked || []).forEach(function(p){
    if(p.uid !== m.uid && !out.some(function(o){ return o.uid === p.uid; })) out.push(p);
  });
  return out;
}
/* a duplicate number only links accounts after the 2FA-style confirmation */
function phoneVerified(){
  var m = loadMe(), p = normPhone(m.phone);
  return !!p && m.verifiedPhone === p;
}
function linkedProfiles(){ return phoneVerified() ? phoneMatches() : []; }
/* one name (and one face) across every linked account */
function commonizeName(name){
  var m = loadMe(), reg = regAll();
  m.name = name;
  phoneMatches().forEach(function(p){ p.name = name; if(reg[p.uid]) reg[p.uid].name = name; });
  try{ localStorage.setItem(REG_KEY, JSON.stringify(reg)); }catch(e){}
}
function commonizePhoto(photo){
  var m = loadMe(), reg = regAll();
  m.photo = photo;
  phoneMatches().forEach(function(p){ p.photo = photo; if(reg[p.uid]) reg[p.uid].photo = photo; });
  try{ localStorage.setItem(REG_KEY, JSON.stringify(reg)); }catch(e){}
}
/* linking changes who "hosting" means \u2014 recompute every event's role */
function remapRoles(){
  var uids = myUids();
  STORE.events.forEach(function(e){
    if(e.hostUid) e.role = uids.indexOf(e.hostUid) > -1 ? 'hosting' : 'invited';
  });
}
/* every event any of my linked uids opened or was invited to */
function myEvents(){
  var seen = {}, out = [];
  [loadMe()].concat(linkedProfiles()).forEach(function(p){
    (p.events || []).forEach(function(id){ if(!seen[id]){ seen[id] = 1; out.push(id); } });
  });
  return out;
}
/* me plus every uid linked to me by phone number */
function myUids(){
  var m = loadMe(), out = [m.uid];
  (m.linked || []).forEach(function(u){ if(out.indexOf(u) < 0) out.push(u); });
  (m.cloudLinked || []).forEach(function(p){ if(out.indexOf(p.uid) < 0) out.push(p.uid); });
  return out;
}
/* my answer for an event \u2014 mine first, then anything a linked uid said */
function myPlus(id){
  var m = loadMe();
  return m.plus[id] || 0;
}
function myRsvp(id){
  var m = loadMe();
  if(m.rsvp[id]) return m.rsvp[id];
  var lp = linkedProfiles(), i;
  for(i = 0; i < lp.length; i++) if(lp[i].rsvp && lp[i].rsvp[id]) return lp[i].rsvp[id];
  return '';
}
function saveMe(){
  var m = loadMe(), reg = regAll();
  m.at = Date.now();
  reg[m.uid] = { uid: m.uid, name: m.name, phone: m.phone, photo: m.photo, at: m.at,
                 events: m.events, claims: m.claims, rsvp: m.rsvp, plus: m.plus };
  m.linked = linkedProfiles().map(function(p){ return p.uid; });
  try{
    localStorage.setItem(ME_KEY, JSON.stringify(m));
    localStorage.setItem(REG_KEY, JSON.stringify(reg));
  }catch(e){}
  if(STORE.mode === 'live' && window.D2C && D2C.saveProfile){
    D2C.saveProfile({ uid: m.uid, name: m.name, phone: normPhone(m.phone),
                      photo: m.photo || '', at: m.at, events: m.events, claims: m.claims,
                      rsvp: m.rsvp, plus: m.plus })
      .then(function(){ return normPhone(m.phone) ? D2C.findByPhone(normPhone(m.phone)) : []; })
      .then(function(list){
        m.cloudLinked = (list || []).filter(function(p){ return p.uid !== m.uid; });
        if(phoneVerified()){
          m.cloudLinked.forEach(function(p){
            (p.events || []).forEach(function(id){ if(m.events.indexOf(id) < 0) m.events.push(id); });
            var k;
            for(k in (p.rsvp || {}))   if(!m.rsvp[k])   m.rsvp[k]   = p.rsvp[k];
            for(k in (p.claims || {})) if(!m.claims[k]) m.claims[k] = p.claims[k];
            for(k in (p.plus || {}))   if(!m.plus[k])   m.plus[k]   = p.plus[k];
          });
          remapRoles(); STORE.notify();
        }
        m.linked = linkedProfiles().map(function(p){ return p.uid; });
        try{ localStorage.setItem(ME_KEY, JSON.stringify(m)); }catch(e){}
        if(m.cloudLinked.length && !phoneVerified()) promptVerify();
        else repaintMe();
      })
      .catch(function(e){ console.warn('profile sync failed', e); });
  }
}
loadMe();

function findEvent(key){ return STORE.byId[key] || null; }

var GUEST_MENU =
  '<button type="button" role="menuitem"><svg class="i"><use href="#check"/></svg>Change RSVP Status</button>' +
  '<button type="button" role="menuitem"><svg class="i"><use href="#chat-dots"/></svg>Message Guest</button>' +
  '<button type="button" role="menuitem"><svg class="i"><use href="#person"/></svg>View Profile</button>' +
  '<button type="button" role="menuitem" class="danger"><svg class="i"><use href="#trash"/></svg>Remove Invitation</button>';

/* ---------- time ---------- */
function ago(isoTs){
  var t = Date.parse(isoTs);
  if(isNaN(t)) return "";
  var m = Math.round((Date.now() - t) / 60000);
  if(m < 1)    return "Just now";
  if(m < 60)   return m + " min ago";
  var hh = Math.round(m / 60);
  if(hh < 24)  return hh + (hh === 1 ? " hour ago" : " hours ago");
  var dd = Math.round(hh / 24);
  if(dd === 1) return "Yesterday";
  if(dd < 7)   return dd + " days ago";
  return new Date(t).toLocaleDateString();
}
function msgFrom(m){
  /* "me" is in the eye of the viewer — the stored isYou flag only breaks the
     tie for legacy messages that carry no uid. */
  return { fromUid: m.fromUid || "", fromName: m.fromName || "Someone",
           fromAvatarUrl: m.fromAvatarUrl || "", text: m.text || "",
           imageUrl: m.imageUrl || "", at: m.at || "",
           isYou: m.fromUid ? myUids().indexOf(m.fromUid) > -1 : !!m.isYou };
}

/* ---------- mapping ---------- */
function chipsFor(ev){
  return [
    ["sun",   ev.vibe],
    ["users", ev.capacity === "Unlimited" ? "No guest limit" : ev.capacity + " max"],
    ["money", ev.entry],
    [/^invite only$/i.test(ev.inviteType) ? "lock" : "globe", ev.inviteType]
  ];
}

/* A Firestore event document -> render model (they are already the same shape;
   this only fills defaults so a partially-written doc cannot break a view). */
function docToModel(id, d){
  var c = d.counts || {};
  return {
    id: id, slug: d.slug || id,
    title: d.title || "Untitled", dateISO: d.dateISO || "1970-01-01",
    time: d.time || "", timeSort: d.timeSort != null ? d.timeSort : t24(d.time || ""),
    venue: d.venue || "", address: d.address || "", about: d.about || "",
    vibe: d.vibe || "Chill", vibes: d.vibes || [],
    capacity: d.capacity || "\u2014", capacityMode: d.capacityMode || "", capacityMax: d.capacityMax || 0,
    entry: d.entry || "\u2014", entryMode: d.entryMode || "", entryNote: d.entryNote || "",
    inviteType: d.inviteType || "Invite only",
    /* step-3 settings ride along so both data modes keep every field */
    plusOnes: d.plusOnes || "", plusOnesMode: d.plusOnesMode || "", plusOnesMax: d.plusOnesMax || 0,
    invitedUids: d.invitedUids || [], invitedGuests: d.invitedGuests || [],
    inviteMessage: d.inviteMessage || "",
    rsvpBy: d.rsvpBy || "", rsvpMode: d.rsvpMode || "",
    visibility: d.visibility || "", visibilityMode: d.visibilityMode || "",
    reminders: d.reminders || [], reminderLabel: d.reminderLabel || "",
    notifyChanges: d.notifyChanges !== false,
    dot: d.dot || "#6d28d9",
    /* hosting is in the eye of the viewer: an event is yours only when its
       hostUid is one of your linked uids */
    role: (d.hostUid && myUids().indexOf(d.hostUid) > -1) ? "hosting" : "invited",
    coverUrl: d.coverUrl || "", thumbUrl: d.thumbUrl || d.coverUrl || "", mapUrl: d.mapUrl || "",
    hostUid: d.hostUid || "", hostName: d.hostName || "Host", hostAvatarUrl: d.hostAvatarUrl || "",
    counts: { going: c.going||0, maybe: c.maybe||0, cant: c.cant||0, pending: c.pending||0 },
    guestPreview: d.guestPreview || [],
    photoCount: d.photoCount || 0, lastPhotoLabel: d.lastPhotoLabel || "",
    /* messages ride along on the event document, so they are realtime for
       free and need no extra listener. */
    messages: (d.chatMessages || []).map(msgFrom),
    chatUnread: d.chatUnread || 0,
    guests: null, waiting: null, maybes: null, cants: null, photos: null, activity: null
  };
}

/* The hardcoded SEED record -> the identical render model. */
function seedToModel(ev){
  return {
    id: ev.id, slug: ev.id,
    title: ev.title, dateISO: ev.date, time: ev.time, timeSort: t24(ev.time),
    venue: ev.venue, address: ev.address, about: ev.about,
    vibe: ev.vibe, capacity: ev.capacity, entry: ev.entry, inviteType: ev.invite,
    dot: ev.dot, role: 'invited',
    coverUrl: IMG(ev.img, 1000, 1250), thumbUrl: IMG(ev.img, 400, 440), mapUrl: IMG(ev.map, 1200, 675),
    hostName: pn(ev.hostId), hostAvatarUrl: pav(ev.hostId),
    counts: { going: ev.going, maybe: ev.maybe, cant: ev.cant, pending: ev.pending },
    guestPreview: ev.guests.slice(0, 5).map(function(g){
      return { name: pn(g.id), avatarUrl: pav(g.id), isHost: !!g.host }; }),
    photoCount: ev.photoCount, lastPhotoLabel: ev.photoWhen,
    messages: ev.thread.map(function(m){
      return { fromUid: m.from, fromName: pn(m.from), fromAvatarUrl: pav(m.from),
               text: m.text, at: new Date(Date.now() - m.minsAgo*60000).toISOString(),
               isYou: m.from === "emily" }; }),
    chatUnread: ev.chat.unread || 0,
    guests: null, waiting: null, maybes: null, cants: null, photos: null, activity: null,
    _seed: ev
  };
}

/* Subcollection payloads for an event, straight off the SEED record. */
function seedDetail(ev){
  var s = ev._seed;
  return {
    guests: s.guests.map(function(g){
      return { name: pn(g.id), avatarUrl: pav(g.id), message: g.msg || "",
               invitedLabel: g.when, isHost: !!g.host, isYou: !!g.you, status: "going" }; }),
    waiting: s.waiting.map(function(g){
      return { name: pn(g.id), avatarUrl: pav(g.id), message: "",
               invitedLabel: g.when, isHost: false, isYou: false, status: "pending" }; }),
    maybes: [], cants: [],
    photos: s.allPhotos.map(function(p){
      return { url: IMG(p.seed, 1400, 1400), thumbUrl: IMG(p.seed, 600, 600),
               byName: pn(p.byId), byAvatarUrl: pav(p.byId), whenLabel: p.when }; }),
    activity: s.activity.map(function(a){
      return { personName: pn(a.id), personAvatarUrl: pav(a.id), icon: a.ic,
               isCheck: !!a.ok, text: a.txt, whenLabel: a.t, quote: !!a.quote }; })
  };
}

/* Append locally (offline mode); live mode goes through D2C.sendMessage. */
function appendLocalMessage(id, text, imageUrl){
  var ev = STORE.byId[id]; if(!ev) return;
  var m = loadMe();
  ev.messages = (ev.messages || []).concat([{
    fromUid: m.uid, fromName: m.name || "Guest", fromAvatarUrl: meAvatar(),
    text: text || "", imageUrl: imageUrl || "",
    at: new Date().toISOString(), isYou: true
  }]);
  STORE.notify();
}

function useLocalData(reason){
  STORE.error = reason || null;
  STORE.setEvents(SEED_EVENTS.map(seedToModel), "local");
}

/* ---------- queries over whatever is loaded ---------- */
function matches(ev, q){
  if(!q) return true;
  return ev.title.toLowerCase().indexOf(q.trim().toLowerCase()) > -1;
}
/* ---------- events hidden on this device ----------
   "Hide" is personal: nothing is written to the event, the ids just sit in
   localStorage and every list filters them out. Reversible from the list. */
var HIDDEN_KEY = 'd2c.hidden.v1', HIDDEN = null;
function hiddenSet(){
  if(HIDDEN) return HIDDEN;
  HIDDEN = {};
  try{
    var raw = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
    if(raw && raw.length) raw.forEach(function(id){ HIDDEN[id] = 1; });
  }catch(e){}
  return HIDDEN;
}
function saveHidden(){
  var out = [], k;
  for(k in HIDDEN) if(HIDDEN[k]) out.push(k);
  try{ localStorage.setItem(HIDDEN_KEY, JSON.stringify(out)); }catch(e){}
}
function isHidden(ev){ var x = hiddenSet(); return !!(x[ev.id] || (ev.slug && x[ev.slug])); }
function hideId(ev){ hiddenSet()[ev.id] = 1; if(ev.slug) HIDDEN[ev.slug] = 1; saveHidden(); }
function unhideAll(){ HIDDEN = {}; saveHidden(); }
function hiddenCount(){
  return STORE.events.filter(isHidden).length;
}
function shown(list){ return list.filter(function(e){ return !isHidden(e); }); }

/* An event is on your page only if you host it or one of your linked uids
   opened it by direct link (any RSVP counts — a "can't go" stays visible so
   you can change your mind). Everything else stays invisible. */
function inMyList(ev){
  if(ev.role === 'hosting') return true;
  var ids = myEvents();
  return ids.indexOf(ev.id) > -1 || (ev.slug && ids.indexOf(ev.slug) > -1);
}
function mineOnly(list){ remapRoles(); return shown(list.filter(inMyList)); }

function eventsOn(iso, q){
  return mineOnly(STORE.events.filter(function(e){ return e.dateISO === iso && matches(e, q); }));
}
function upcoming(){ return mineOnly(STORE.events.filter(function(e){ return e.dateISO >= TODAY; })); }
function past(){ return mineOnly(STORE.events.filter(function(e){ return e.dateISO < TODAY; }))
  .slice().reverse(); }
function hosting(){ return mineOnly(STORE.events.filter(function(e){ return e.role === "hosting"; })); }

<script>
/* ================= tiny helpers ================= */
function h(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ico(id,cls){ return '<svg class="i'+(cls?' '+cls:'')+'"><use href="#'+id+'"/></svg>'; }
function img(url,alt,cls){ return '<img'+(cls?' class="'+cls+'"':'')+' src="'+(url||'')+'" alt="'+
  h(alt||'')+'" loading="lazy" decoding="async">'; }
function fname(n){ return String(n||'').split(' ')[0]; }
var _toastT=null;
function toast(msg,kind,ms){
  var el=document.getElementById('toast'); if(!el) return;
  clearTimeout(_toastT);
  el.className='toast'+(kind==='err'?' err':'');
  el.innerHTML=(kind==='wait'?'<span class="spin"></span>':'')+h(msg);
  el.hidden=false;
  if(ms!==0) _toastT=setTimeout(function(){ el.hidden=true; }, ms||2600);
}
function absUrl(hash){ return location.origin + location.pathname + '#' + hash; }
function mapsUrl(ev){
  return 'https://www.google.com/maps/search/?api=1&query='+
    encodeURIComponent((ev.venue?ev.venue+', ':'')+ev.address);
}
function skel(msg){ return '<p class="skel">'+h(msg||'Loading\u2026')+'</p>'; }
/* one wordmark, used by the home header and by every subpage's back row */
function brandMark(){ return '<span class="logo">DOWN<i>2</i>CHILL<b>\u2726</b></span>'; }
function profBtn(){
  return '<a class="round-btn mini" href="#profile" data-nav aria-label="Your profile">'+
    '<img class="me-mini" src="'+h(meAvatar())+'" alt=""></a>';
}

function statusPill(ev){
  if(ev.dateISO<TODAY) return '<span class="pill went">'+(ev.role==='hosting'?'Hosted':'Went')+'</span>';
  if(ev.role==='hosting') return '<span class="pill host">Hosting</span>';
  var r=myRsvp(ev.id);
  if(r==='going') return '<span class="pill host">Going</span>';
  if(r==='maybe') return '<span class="pill inv">Maybe</span>';
  if(r==='cant')  return '<span class="pill went">Can\u2019t go</span>';
  return '<span class="pill inv">Invited</span>';
}

/* ================= HOME ================= */
function eventCard(ev){
  var dp=dparts(ev.dateISO);
  return '<a class="ecard" href="#event/'+ev.id+'" data-nav>'+
    img(ev.thumbUrl, ev.title, 'thumb')+
    '<span class="emore" data-evmenu="'+ev.id+'" role="button" tabindex="0" aria-haspopup="true" '+
      'aria-expanded="false" aria-label="Options for '+h(ev.title)+'">'+ico('more')+'</span>'+
    '<div class="ebody">'+

function groupByMonth(list){
  var out=[],last=null;
  list.forEach(function(ev){
    var dp=dparts(ev.dateISO);
    if(dp.monKey!==last){ out.push({month:dp.mon+(dp.year!==dparts(TODAY).year?' '+dp.year:'')}); last=dp.monKey; }
    out.push({ev:ev});
  });
  return out;
}

var calState={ y:2021, m:6, sel:TODAY, mode:'month', q:'', open:1 };

function calCell(iso,out,q,maxLab){

function calBody(){
  var q=calState.q, cells='', label='', i;
  if(calState.mode==='week'){
    var ws=weekStart(calState.sel), we=addDays(ws,6);
    var a=dparts(ws), b=dparts(we);
    label = a.monShort+' '+a.day+' \u2013 '+(a.mon===b.mon? b.day : b.monShort+' '+b.day)+', '+b.year;
    for(i=0;i<7;i++) cells+=calCell(addDays(ws,i),false,q,3);
  } else {
    var y=calState.y, m=calState.m,
        firstDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(),
        total=Math.ceil((firstDow+dim)/7)*7;

        : '<p class="empty">No events on this day.</p>');

/* ================= GUESTS ================= */
var guestsOpen = {};

/* The four lists a guests page shows. Names are the join key: when someone
   claims a curated invite and answers, their own row replaces the host-typed
   pending row instead of sitting next to it.                                */
function guestBuckets(ev){
  var m = loadMe(), my = myRsvp(ev.id), myName = m.name || m.claims[ev.id] || '';
  var b = { going: (ev.guests || []).slice(), maybe: (ev.maybes || []).slice(),
            cant: (ev.cants || []).slice(), waiting: (ev.waiting || []).slice() };
  var mine = function(g){
    return (myName && g.name.toLowerCase() === myName.toLowerCase()) || g.isYou;
  };
  /* local mode: my claim / answer only lives on this device, so fold it in.
     Live mode streams my own guests/{uid} doc, so only mark it as me. */
  if(STORE.mode === 'live'){
    ['going','maybe','cant','waiting'].forEach(function(k){
      b[k].forEach(function(g){ if(g.uid === m.uid || mine(g)) g.isYou = true; });
    });
  } else if(myName && ev.role !== 'hosting'){
    ['going','maybe','cant','waiting'].forEach(function(k){
      b[k] = b[k].filter(function(g){ return !mine(g); });
    });
    var meRow = { name: myName, avatarUrl: meAvatar(), message: '',
                  invitedLabel: my ? 'Responded' : 'Viewing this event',
                  isHost: false, isYou: true, status: my || 'pending',
                  plus: myPlus(ev.id) };
    /* you always see yourself first in your section */
    if(my === 'going') b.going.unshift(meRow);
    else if(my === 'maybe') b.maybe.unshift(meRow);
    else if(my === 'cant') b.cant.unshift(meRow);
    else if(m.claims[ev.id] || myEvents().indexOf(ev.id) > -1) b.waiting.unshift(meRow);
  }
  /* anyone who answered no longer waits under the same name */
  var responded = {};
  b.going.concat(b.maybe).concat(b.cant).forEach(function(g){
    responded[g.name.toLowerCase()] = 1;
  });
  b.waiting = b.waiting.filter(function(g){ return !responded[g.name.toLowerCase()]; });
  return b;
}
function renderGuests(id){
  var ev=findEvent(id); if(!ev) return renderHome();
  var b=ev.guests?guestBuckets(ev):null;
  var c=b?{going:b.going.length, maybe:b.maybe.length, cant:b.cant.length, pending:b.waiting.length}
       :ev.counts;
  var responses=c.going+c.maybe+c.cant, invites=responses+c.pending;
  var pct=invites?Math.round(responses/invites*100):0;

  function goingRow(g){
    return '<div class="g-row"><span class="g-av on">'+img(g.avatarUrl,'')+'</span>'+
      '<div class="g-txt"><div class="g-name"><b>'+h(g.name)+'</b>'+
        (g.isHost?'<span class="tag">Host</span>':'')+
        (g.plus?'<span class="tag">+'+g.plus+'</span>':'')+'</div>'+
        (g.message?'<p>'+h(g.message)+'</p>':'')+'<small>'+h(g.invitedLabel)+'</small></div>'+
      '<span class="g-end">'+(g.isYou?'<em>You</em>':'')+ico('chev')+'</span></div>';
  }
  function waitRow(g){

/* ================= CREATE EVENT =================
   Two steps, both rendered from one DRAFT object that is mirrored into
   localStorage. Every control writes straight into DRAFT, so a repaint (or a
   reload, or "Save Draft") never loses what has been typed. Step 2's Save
   Event writes the real Firestore document; the cover photo is uploaded to
   Cloud Storage the moment it is chosen.
   =============================================== */

/* tile colours match the mood grid in the app */
var VIBES = [
  { k:'Coffee', ic:'v-coffee', bg:'#A7F3D0', fg:'#10B981' },
  { k:'Chill',  ic:'v-chill',  bg:'#BFDBFE', fg:'#3B82F6' },
  { k:'Game',   ic:'v-game',   bg:'#FECDD3', fg:'#FB7185' },
  { k:'Go-Out', ic:'v-goout',  bg:'#FED7AA', fg:'#FB923C' },
  { k:'Food',   ic:'v-snack',  bg:'#A7F3D0', fg:'#10B981' },
  { k:'Study',  ic:'v-study',  bg:'#C7D2FE', fg:'#6366F1' },
  { k:'Event',  ic:'v-ticket', bg:'#C7D2FE', fg:'#6366F1' }
];
/* iconN.svg (grey #E5E7EB / #9CA3AF) is the unselected tile, iconN-bg.svg the
   selected one — same geometry, so one symbol plus these colours covers both. */
var VIBE_OFF = { bg:'#E5E7EB', fg:'#9CA3AF' };
var VIBE_BY = {};
VIBES.forEach(function(v){ VIBE_BY[v.k] = v; });
function vibeDot(list){ var v = VIBE_BY[(list || [])[0]]; return v ? v.fg : '#6d28d9'; }

var TIME_OPTS = (function(){
  var a = [], i, hh, mm;
  for(i = 0; i < 96; i++){
    hh = Math.floor(i / 4); mm = (i % 4) * 15;
    a.push((hh % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + ' ' + (hh < 12 ? 'AM' : 'PM'));
  }
  return a;
})();
function timePlus(t, mins){
  var m = t24(t); if(!t) return '';
  return TIME_OPTS[Math.round(((m + mins) % 1440) / 15)];
}
/* ---------- draft state ---------- */
var DRAFT_KEY = 'd2c.draft.v2', DRAFTS_KEY = 'd2c.eventdrafts.v1', DRAFT = null;

/* ---- saved drafts: parked events, visible under Hosting, sent to no one ---- */
function eventDrafts(){
  try{ return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]') || []; }catch(e){ return []; }
}
function writeEventDrafts(list){
  try{ localStorage.setItem(DRAFTS_KEY, JSON.stringify(list)); }catch(e){}
}
function saveEventDraft(){
  var d = loadDraft(), list = eventDrafts(), snap = {}, k, i;
  if(!d.draftId) d.draftId = 'dft-' + Date.now().toString(36);
  for(k in d) if(k.charAt(0) !== '_') snap[k] = d[k];
  for(i = 0; i < list.length; i++) if(list[i].draftId === d.draftId) break;
  list[i] = snap;
  writeEventDrafts(list);
  return d.draftId;
}
function deleteEventDraft(id){
  writeEventDrafts(eventDrafts().filter(function(x){ return x.draftId !== id; }));
}
function resumeEventDraft(id){
  var snap = eventDrafts().filter(function(x){ return x.draftId === id; })[0];
  if(!snap) return false;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(snap)); }catch(e){}
  DRAFT = null; loadDraft();
  return true;
}

function blankDraft(){
  var tomorrow = addDays(TODAY, 1);
  return { draftId:'', title:'', coverUrl:'', coverPath:'',
           date:tomorrow, time:'7:00 PM', endTime:null,
           venue:'', address:'', about:'', vibes:[], vibeMore:false,
           /* step 3 */
           capMode:'custom', capacity:30,
           invite:'Invite Only',
           plusMode:'one', plusN:2,
           /* same day as the event until the host sets it themselves */
           rsvpMode:'custom', rsvpBy:tomorrow, rsvpTouched:false,
           entryMode:'free', entryNote:'',
           visibility:'friends',
           reminders:[1440], remN:2, remUnit:'Hours', notifyChanges:true,
           /* step 4 */
           invitees:[], extra:[], inviteMsg:'', msgTouched:false };
}
function loadDraft(){
  if(EDIT) return EDIT.draft;        /* step 3 edits the event in place */
  if(DRAFT) return DRAFT;
  DRAFT = blankDraft();
  try{
    var saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if(saved) for(var k in DRAFT){ if(saved[k] != null) DRAFT[k] = saved[k]; }
  }catch(e){}
  /* an object URL from a previous session is dead \u2014 drop the preview */
  if(/^blob:/.test(DRAFT.coverUrl) && !DRAFT.coverPath) DRAFT.coverUrl = '';
  if(!Array.isArray(DRAFT.vibes)) DRAFT.vibes = [];
  if(!Array.isArray(DRAFT.reminders)) DRAFT.reminders = [];
  if(!Array.isArray(DRAFT.invitees)) DRAFT.invitees = [];
  if(!Array.isArray(DRAFT.extra)) DRAFT.extra = [];
  /* a contact icon is an object URL — dead after a reload, so fall back */
  DRAFT.extra.forEach(function(e){ if(/^blob:/.test(e.photo || '')) e.photo = ''; });
  return DRAFT;
}
function saveDraft(){
  if(EDIT) return;                   /* an edit is committed, never autosaved */
  try{
    var d = loadDraft(), o = {};
    for(var k in d){ if(k.charAt(0) !== '_') o[k] = d[k]; }
    localStorage.setItem(DRAFT_KEY, JSON.stringify(o));
  }catch(e){}
}
function clearDraft(){
  if(DRAFT && DRAFT._objUrl) URL.revokeObjectURL(DRAFT._objUrl);
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  DRAFT = null;
}

}

function applyP2(key, v){
  var d = loadDraft();
  if(key === 'cap'){
    if(v === 'Unlimited') d.capMode = 'unlimited';
    else { d.capMode = 'custom'; d.capacity = parseInt(v, 10) || d.capacity; }
  } else if(key === 'invite'){
    d.invite = v;
  } else if(key === 'plus'){
    if(v === 'Not allowed') d.plusMode = 'none';
    else if(v === 'Allowed') d.plusMode = 'one';
    else { d.plusMode = 'custom'; d.plusN = parseInt(v.replace(/\D/g,''), 10) || d.plusN; }
  } else if(key === 'entry'){
    if(v === 'Free') d.entryMode = 'free';
    else if(v === 'Pay at event') d.entryMode = 'door';
  } else if(key === 'vis'){
    VIS_OPTS.forEach(function(o){ if(o.lab === v) d.visibility = o.k; });
  } else if(key === 'rem'){
    if(v === 'None') d.reminders = [];
    else if(v === '1 week before') d.reminders = [10080];
    else if(v === '1 day before')  d.reminders = [1440];
    else if(v === '1 hour before') d.reminders = [60];
  }
}

var repaintInvites = function(){};

/* ---------- people added by hand, and the device address book ----------
   CONTACTS is session-only: the picked address book is never written to
   localStorage. Only the people actually invited are kept, in DRAFT.extra,
   because those are exactly what the event document will carry anyway.

var CONTACTS = [];

function slugId(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) ||
         'x' + (Math.abs(hashStr(String(s))) % 100000);
}
function hashStr(s){
  var hOut = 0, i;
  for(i = 0; i < s.length; i++) hOut = (hOut * 31 + s.charCodeAt(i)) | 0;
  return hOut;
}
function faceOf(p){ return p.photo || GAV; }
function extraAt(d, id){
  for(var i = 0; i < d.extra.length; i++) if(d.extra[i].id === id) return i;
  return -1;
}
function inviteCount(d){ return d.invitees.length + d.extra.length; }

/* "Sam Ruiz 555-0123" -> {name:'Sam Ruiz', phone:'555-0123'} */
function parseEntry(raw){
  var t = String(raw).trim().replace(/\s+/g, ' ');
  if(!t) return null;
  var m = t.match(/^(.*?)[\s,]*([+(]?\d[\d\s\-().]{5,})$/);
  var name = (m ? m[1] : t).trim().replace(/[,;]+$/, '');
  var phone = m ? m[2].trim() : '';
  if(!name){ name = phone; phone = ''; }
  return name ? { name: name, phone: phone } : null;
}
/* Commit one or many comma-separated entries; returns how many were added. */
function addManual(raw){
  var d = loadDraft(), added = 0;
  String(raw).split(/[,;\n]+/).forEach(function(part){
    var e = parseEntry(part);
    if(!e) return;
    var id = 'm-' + slugId(e.name + '|' + e.phone);
    if(extraAt(d, id) > -1) return;                    // already on the list
    d.extra.push({ id: id, name: e.name, phone: e.phone, photo: '', src: 'manual' });
    added++;
  });
  if(added) saveDraft();
  return added;
}

/* ---------- contacts ---------- */
function contactsReady(){
  return !!(window.navigator && navigator.contacts && navigator.contacts.select &&
            window.isSecureContext && window.top === window.self);
}
function contactToPerson(c){
  var name = (c.name && c.name[0]) || '',
      tel  = (c.tel && c.tel[0]) || '',
      icon = (c.icon && c.icon[0]) || null;
  return { id: 'c-' + slugId(name + '|' + tel), name: name.trim(), phone: tel,
           photo: icon ? URL.createObjectURL(icon) : '', src: 'contact' };
}
function importContacts(){
  if(!contactsReady()){
    toast('Your contacts aren\u2019t available in this browser \u2014 add people by name below.', 'err', 5000);
    return;
  }
  var run = function(props){
    navigator.contacts.select(props, { multiple: true }).then(function(list){
      var people = (list || []).map(contactToPerson).filter(function(p){ return p.name; });
      if(!people.length){ toast('No contacts chosen'); return; }
      CONTACTS = people;
      inviteQ = ''; inviteGroup = 'all';
      toast(people.length + (people.length === 1 ? ' contact loaded' : ' contacts loaded'));
      repaintInvites();
    }).catch(function(e){
      toast(e && e.name === 'AbortError'
        ? 'Contact import cancelled'
        : 'Could not read your contacts on this device.', 'err', 4500);
    });
  };
  var want = ['name', 'tel', 'icon'];
  if(navigator.contacts.getProperties){
    navigator.contacts.getProperties().then(function(have){
      var props = want.filter(function(p){ return have.indexOf(p) > -1; });
      run(props.length ? props : ['name']);
    }).catch(function(){ run(['name', 'tel']); });
  } else run(['name', 'tel']);
}

/* ---------- a face for someone added by hand ---------- */
function shrinkImage(file, size, cb){
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function(){
    try {
      var c = document.createElement('canvas'), s = Math.min(img.width, img.height),
          x = c.getContext('2d');
      c.width = c.height = size;
      x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      cb(c.toDataURL('image/jpeg', 0.82));
    } catch(e){ cb(''); }
    URL.revokeObjectURL(url);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(''); };
  img.src = url;
}
function pickFace(id){
  var input = document.getElementById('face-input');
  input.value = '';
  input.onchange = function(){
    var f = input.files && input.files[0];
    if(!f) return;
    if(!/^image\//.test(f.type)){ toast('That file isn\u2019t an image.', 'err'); return; }
    shrinkImage(f, 96, function(url){
      if(!url){ toast('Could not read that image.', 'err'); return; }
      var d = loadDraft(), at = extraAt(d, id);
      if(at > -1){ d.extra[at].photo = url; saveDraft(); repaintInvites(); }
    });
  };
  input.click();
}

/* ---- .vcf import: works in every browser, and brings ALL contacts at once.
   Android vCard 2.1 quotes non-ASCII names as QUOTED-PRINTABLE UTF-8. ---- */
function qpDecode(v){
  try{
    var bytes = [];
    String(v).replace(/=([0-9A-F]{2})|([\s\S])/gi, function(_, hx, ch){
      if(hx) bytes.push(parseInt(hx, 16));
      else if(ch) bytes.push(ch.charCodeAt(0) & 255);
      return '';
    });
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
  }catch(e){ return v; }
}
function parseVCF(text){
  var out = [];
  text = String(text).replace(/\r/g, '').replace(/\n[ \t]/g, '');   /* unfold */
  text.split(/BEGIN:VCARD/i).forEach(function(card){
    if(!/END:VCARD/i.test(card)) return;
    var fn = '', nName = '', tel = '';
    card.split('\n').forEach(function(ln){
      var ix = ln.indexOf(':');
      if(ix < 0) return;
      var key = ln.slice(0, ix).toUpperCase(), val = ln.slice(ix + 1).trim();
      if(key.indexOf('QUOTED-PRINTABLE') > -1) val = qpDecode(val);
      if(key === 'FN' || key.indexOf('FN;') === 0){ if(!fn) fn = val; }
      else if(key === 'N' || key.indexOf('N;') === 0){ if(!nName) nName = val; }
      else if(key.indexOf('TEL') === 0){ if(!tel) tel = val; }
    });
    if(!fn && nName) fn = nName.split(';').filter(Boolean).reverse().join(' ').trim();
    fn = fn.trim();
    if(fn) out.push({ name: fn, phone: tel.trim() });
  });
  return out;
}

      if(seen[id]) return;

function numOf(s, dflt){

/* An event document -> the draft shape step 3 edits. Seeded events predate

function eventToDraft(ev){
  var d = blankDraft();

  d.venue = ev.venue; d.address = ev.address; d.about = ev.about;
  d.vibes = (ev.vibes && ev.vibes.length) ? ev.vibes.slice() : [];
  d.capMode  = ev.capacityMode || (/unlimited|no limit/i.test(ev.capacity || '') ? 'unlimited' : 'custom');
  d.capacity = ev.capacityMax || numOf(ev.capacity, 30);
  d.invite   = ev.inviteType && /^(Invite Only|Open Invite|Public Link)$/.test(ev.inviteType)
             ? ev.inviteType : 'Invite Only';
  d.plusMode = ev.plusOnesMode || (/not allowed/i.test(ev.plusOnes || '') ? 'none' : 'one');
  d.plusN    = ev.plusOnesMax > 1 ? ev.plusOnesMax : 2;

  d.entryNote = ev.entryNote || (d.entryMode === 'custom' ? (ev.entry || '') : '');

  var d = loadDraft();
  if(!/^image\//.test(file.type)){ toast('That file isn\u2019t an image.', 'err'); return; }
  if(file.size > 25 * 1024 * 1024){
    toast('That image is ' + (file.size/1048576).toFixed(1) + ' MB \u2014 the limit is 25 MB.', 'err', 4000);
    return;

  if(!(STORE.mode === 'live' && window.D2C && D2C.uploadCover)){
    if(d._objUrl) URL.revokeObjectURL(d._objUrl);

    d.coverUrl = r.url; d.coverPath = r.path;

/* names already claimed by some OTHER visitor \u2014 from streamed guest rows
   (live) and from every registry profile's claims map (local) */
function takenNames(ev){
  var m = loadMe(), out = {};
  [].concat(ev.guests || [], ev.maybes || [], ev.cants || [], ev.waiting || [])
    .forEach(function(g){
      if(g.uid && /^u-/.test(g.uid) && g.uid !== m.uid && g.name) out[g.name.toLowerCase()] = 1;
    });
  var reg = regAll(), k;
  for(k in reg){
    if(k === m.uid) continue;
    var c = reg[k].claims || {};
    var nm = c[ev.id] || (ev.slug && c[ev.slug]);
    if(nm) out[nm.toLowerCase()] = 1;
  }
  return out;
}
function claimCard(ev){
  var taken = takenNames(ev);
  /* a claimed name simply is not on the menu any more */
  var rows = claimList(ev).filter(function(g){ return !taken[g.name.toLowerCase()]; })
    .map(function(g){
      return '<button class="claim-row" type="button" data-claim="' + h(g.name) + '">' +
        '<img src="' + h(g.avatarUrl || GAV) + '" alt="">' +
        '<b>' + h(g.name) + '</b>' + (g.phone ? '<span>' + h(g.phone) + '</span>' : '') +
      '</button>';
    }).join('');
  return '<div class="modal-card claim" data-claimfor="' + h(ev.id) + '">' +
    '<button class="modal-x" type="button" data-modal-close aria-label="Close">' + ico('x') + '</button>' +
    '<div class="modal-ic">\uD83D\uDC4B</div>' +
    '<h3 id="modal-h">Who are you?</h3>' +
    (rows
      ? '<p>' + h(fname(ev.hostName)) + ' invited these people. Tap your name, or type it below.</p>' +
        '<div class="claim-list">' + rows + '</div><div class="claim-or"><span>or</span></div>'
      : '<p>Type your name so ' + h(fname(ev.hostName)) + ' knows who\u2019s coming.</p>') +
    '<div class="addbox">' +
      '<input class="inp" id="claim-name" type="text" maxlength="40" placeholder="Your name">' +
      '<button class="addbtn" type="button" data-claim-go>' + ico('arr') + 'That\u2019s me</button>' +
    '</div>' +
  '</div>';
}
function nameCard(){
  return '<div class="modal-card claim">' +
    '<button class="modal-x" type="button" data-modal-close aria-label="Close">' + ico('x') + '</button>' +
    '<div class="modal-ic">\uD83D\uDC4B</div>' +
    '<h3 id="modal-h">What\u2019s your name?</h3>' +
    '<p>Your guests will see who\u2019s inviting them.</p>' +
    '<div class="addbox">' +
      '<input class="inp" id="claim-name" type="text" maxlength="40" placeholder="Your name">' +
      '<button class="addbtn" type="button" data-name-go>' + ico('arr') + 'Continue</button>' +
    '</div>' +
  '</div>';
}
function finishCard(){
  var m = loadMe();
  return '<div class="modal-card claim">' +
    '<button class="modal-x" type="button" data-modal-close aria-label="Close">' + ico('x') + '</button>' +
    '<div class="fin-av"><img src="' + h(meAvatar()) + '" alt="">' +
      '<button class="cam" type="button" data-mephoto aria-label="Add a photo">' + ico('cam') + '</button></div>' +
    '<h3 id="modal-h">Nice to meet you, ' + h(fname(m.name)) + '!</h3>' +
    '<p>Add a photo and phone number so friends recognize you \u2014 your number also links your other devices.</p>' +
    '<input class="inp" id="fin-phone" type="tel" inputmode="tel" maxlength="20" ' +
      'placeholder="Phone number" value="' + h(m.phone) + '">' +
    '<button class="modal-cta" type="button" data-finish>Save</button>' +
    '<button class="modal-later" type="button" data-modal-close>Skip for now</button>' +
  '</div>';
}
function verifyCard(){
  var m = loadMe(), k = phoneMatches().length;
  return '<div class="modal-card claim">' +
    '<button class="modal-x" type="button" data-modal-close aria-label="Close">' + ico('x') + '</button>' +
    '<div class="modal-ic">' + ico('lock') + '</div>' +
    '<h3 id="modal-h">Verify your number</h3>' +
    '<p><b>' + h(m.phone) + '</b> is already on ' + k + ' other account' + (k === 1 ? '' : 's') + '. ' +
      'To link them into one, confirm the number is yours with the code we texted you.</p>' +
    '<input class="inp vf" id="vf-code" type="text" inputmode="numeric" maxlength="6" ' +
      'autocomplete="one-time-code" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022">' +
    '<button class="modal-cta" type="button" data-verify>Verify & Link</button>' +
    '<button class="modal-later" type="button" data-modal-close>Not now</button>' +
    '<p class="onote center">Demo build \u2014 no text is actually sent, any 6 digits work.</p>' +
  '</div>';
}
/* candidates + current picks, set by finishLink before the sheet opens */
var MERGE = { names: [], photos: [], name: '', photo: '' };
function mergeCard(){
  var nameSec = MERGE.names.length > 1
    ? '<p class="mg-lab">Name</p>' + MERGE.names.map(function(o){
        return '<button class="modal-cta pick' + (MERGE.name === o.v ? ' on' : '') + '" type="button" ' +
          'data-mname="' + h(o.v) + '">' + h(o.v) +
          '<span class="tagn">' + (o.mine ? 'new' : 'existing') + '</span></button>';
      }).join('')
    : '';
  var photoSec = MERGE.photos.length
    ? '<p class="mg-lab">Photo</p><div class="mg-avs">' + MERGE.photos.map(function(o, i){
        return '<button class="mg-av' + (MERGE.photo === o.v ? ' on' : '') + '" type="button" ' +
          'data-mphoto="' + i + '" aria-label="' + (o.mine ? 'Your photo' : 'Existing photo') + '">' +
          '<img src="' + h(o.v) + '" alt=""></button>';
      }).join('') +
      '<button class="mg-av up" type="button" data-mupload aria-label="Upload a new photo">' +
        ico('cam-plus') + '</button>' +
      '</div>'
    : '';
  return '<div class="modal-card claim">' +
    '<button class="modal-x" type="button" data-modal-close aria-label="Keep the most recent">' + ico('x') + '</button>' +
    '<div class="modal-ic">' + ico('person') + '</div>' +
    '<h3 id="modal-h">Make them one</h3>' +
    '<p>Your linked accounts differ. Pick what everyone should see \u2014 skipping keeps the most recent.</p>' +
    nameSec + photoSec +
    '<button class="modal-cta go" type="button" data-mergego>Save</button>' +
    '<button class="modal-later" type="button" data-modal-close>Skip \u2014 keep most recent</button>' +
  '</div>';
}
function renderProfile(){
  var m = loadMe(), linked = linkedProfiles(), evs = myEvents().length;
  return '<div class="wrap narrow">' +
    '<header class="top">' +
      '<a class="icon-btn" href="#home" data-back="home" aria-label="Back to events">' + ico('back') + '</a>' +
      brandMark() + '<div class="sp"></div>' +
    '</header>' +
    '<h1 class="title">Your Profile</h1>' +
    '<div class="me-card">' +
      '<div class="me-av"><img src="' + h(meAvatar()) + '" alt="Your photo">' +
        '<button class="cam" type="button" data-mephoto aria-label="Change photo">' + ico('cam') + '</button></div>' +
      '<div class="me-fields">' +
        '<label class="lab" for="me-name">Name</label>' +
        '<input class="inp" id="me-name" type="text" maxlength="40" data-me="name" ' +
          'placeholder="Your name" value="' + h(m.name) + '">' +
        '<label class="lab" for="me-phone">Phone number</label>' +
        '<input class="inp" id="me-phone" type="tel" inputmode="tel" maxlength="20" data-me="phone" ' +
          'placeholder="555-0123" value="' + h(m.phone) + '">' +
        '<p class="onote">Add your number and every device you use it on becomes one account \u2014 ' +
          'events from each show up everywhere.</p>' +
        '<button class="cta solo" type="button" data-mesave>Save Profile</button>' +
      '</div>' +
    '</div>' +
    '<section class="sec"><div class="sec-h"><h2>Account</h2></div><div class="scard">' +
      '<div class="srow noact"><span class="sic">' + ico('person') + '</span><b>Visitor ID</b>' +
        '<span class="sval mono">' + h(m.uid) + '</span></div>' +
      '<div class="srow noact"><span class="sic">' + ico('cal-p') + '</span><b>Events opened</b>' +
        '<span class="sval">' + evs + '</span></div>' +
      '<div class="srow noact"><span class="sic">' + ico('phone') + '</span><b>Linked accounts</b>' +
        '<span class="sval">' + (linked.length ||
          (phoneMatches().length ? 'Verify to link ' + phoneMatches().length : 'None yet')) + '</span></div>' +
    '</div></section>' +
    (linked.length ?
      '<section class="sec"><div class="sec-h"><h2>Linked accounts</h2></div>' +
      '<p class="fsub">These visitor ids share your phone number, so their events count as yours.</p>' +
      '<div class="glist">' + linked.map(function(p){
        var k = (p.events || []).length;
        return '<div class="grow"><span class="gav"><img src="' + h(p.photo || GAV) + '" alt=""></span>' +
          '<span class="gtx"><b>' + h(p.name || 'Unnamed visitor') + '</b>' +
          '<span>' + h(p.uid) + ' \u00B7 ' + k + (k === 1 ? ' event' : ' events') + '</span></span></div>';
      }).join('') + '</div></section>' : '') +
  '</div>';
}

/* ================= chrome (fixed bars) ================= */
function bottomNav(active){
  return '<nav class="bnav" aria-label="Main">'+
    '<a class="bnav-i" href="#home" data-nav'+(active==='home'?' aria-current="page"':'')+'>'+
      ico('home')+'<span>Home</span></a>'+
    '<a class="bnav-new" href="#create" data-nav><span class="em">\uD83D\uDDD3\uFE0F</span>New Event</a>'+
    '<a class="bnav-i" href="#calendar" data-nav'+(active==='calendar'?' aria-current="page"':'')+'>'+
      ico('cal-p')+'<span>Calendar</span></a>'+
  '</nav>';
}
function eventDock(id){
  return '<nav class="dock" aria-label="Event actions">'+
    '<a href="#">'+ico('user-plus')+'<span>Invite Friends</span></a>'+
    '<a href="#chat/'+id+'" data-nav>'+ico('chat')+'<span>Event Chat</span></a>'+
    '<button type="button" data-share-kind="event" data-share-id="'+id+'">'+
      ico('net')+'<span>Share Event</span></button></nav>';
}
</script>
<script>
(function(){
  var app=document.getElementById('app'),
      chrome=document.getElementById('chrome'),
      menu=document.getElementById('row-menu'),
      lb=document.getElementById('lightbox'),
      modal=document.getElementById('app-modal'),
      anchor=null, homeTab='upcoming', homeQ='', scrolls={}, curKey='', watching=null,
      lbEvent=null, lbIdx=0;

  function route(){
    var hash=location.hash.replace(/^#/,''), parts=hash.split('/');
    if(parts[0]==='event')  return {v:'event',  id:parts[1]};
    if(parts[0]==='guests') return {v:'guests', id:parts[1]};
    if(parts[0]==='photos') return {v:'photos', id:parts[1]};
    if(parts[0]==='chat')   return {v:'chat',   id:parts[1]};
    if(parts[0]==='calendar') return {v:'calendar'};
    if(parts[0]==='debug') return {v:'debug'};
    if(parts[0]==='create') return {v:'create', step: +parts[1] >= 2 && +parts[1] <= 4 ? +parts[1] : 1};
    if(parts[0]==='edit') return {v:'edit', id:parts[1]};
    if(parts[0]==='profile') return {v:'profile'};
    return {v:'home'};
  }

  var homeSearch=false;

  function render(){
    closeMenu();
    var r=route(), key=location.hash||'#home';

    /* Detail views stream their subcollections; attach on entry, drop on exit. */
    var wants = (r.v==='event'||r.v==='guests'||r.v==='photos'||r.v==='chat') ? r.id : null;
    if(wants !== watching){
      if(window.D2C && D2C.watchEvent){
        D2C.unwatchEvent();
        watching = wants;
        if(wants) D2C.watchEvent(wants);
      } else {
        /* The firebase module is a deferred <script type="module">, so on a
           deep link it hasn't loaded yet. Leave `watching` unset so the next
           render (the store's first notify) actually attaches the listeners. */
        watching = null;
      }
    }

    /* the create form owns its own state, so it opens before events load */
    if(!STORE.ready && r.v!=='create' && r.v!=='profile'){ app.innerHTML=loadingView(); chrome.innerHTML=''; return; }
    /* leaving the edit screen by any route drops the pending changes */
    if(r.v!=='edit' && EDIT) endEdit();
    if(r.v==='edit' && (!EDIT || EDIT.id!==r.id) && !startEdit(r.id)){
      toast('That event is no longer here','err'); r={v:'home'};
      history.replaceState({d:0},'','#home');
    }
    var curKeyChanged = curKey !== key;
    if(curKey && curKeyChanged) scrolls[curKey]=app.scrollTop;

    closeLb();
    if(curKeyChanged || !modal.querySelector('.claim')) closeModal();
    if(r.v==='home'){      app.innerHTML=renderHome(homeTab,homeQ,homeSearch); chrome.innerHTML=bottomNav('home'); }
    else if(r.v==='calendar'){ app.innerHTML=renderCalendar();  chrome.innerHTML=bottomNav('calendar'); }
    else if(r.v==='event'){    app.innerHTML=renderEvent(r.id); chrome.innerHTML=eventDock(r.id); }
    else if(r.v==='chat'){     app.innerHTML=renderChat(r.id);  chrome.innerHTML=composer(r.id);
                               scrollThread(); }
    else if(r.v==='photos'){   app.innerHTML=renderPhotos(r.id);chrome.innerHTML=''; }
    else if(r.v==='debug'){    app.innerHTML=renderDebug();     chrome.innerHTML=bottomNav(''); }
    else if(r.v==='profile'){  app.innerHTML=renderProfile();  chrome.innerHTML=bottomNav('profile'); }
    else if(r.v==='edit'){     app.innerHTML=renderCreate3();  chrome.innerHTML=editFoot(); }
    else if(r.v==='create'){   app.innerHTML=r.step===4?renderCreate4()
                                              :r.step===3?renderCreate3()
                                              :r.step===2?renderCreate2():renderCreate1();
                               chrome.innerHTML=createFoot(r.step); }
    else {                     app.innerHTML=renderGuests(r.id);chrome.innerHTML=''; }

    document.body.className = (r.v==='event') ? 'has-dock'
                            : (r.v==='create'||r.v==='edit') ? 'has-cbar'
                            : (r.v==='guests'||r.v==='photos'||r.v==='chat') ? '' : 'has-nav';
    var cSheet=modal.querySelector('[data-claimfor]');
    if(cSheet && r.v==='event' && cSheet.dataset.claimfor===r.id){
      var cInp=document.getElementById('claim-name'),
          cVal=cInp?cInp.value:'', cFoc=document.activeElement===cInp,
          cAt=cInp?cInp.selectionStart:0, cEv=findEvent(r.id);
      if(cEv){
        modal.innerHTML=claimCard(cEv);
        var cInp2=document.getElementById('claim-name');
        if(cInp2){ cInp2.value=cVal;
          if(cFoc){ cInp2.focus(); try{ cInp2.setSelectionRange(cAt,cAt); }catch(e){} } }
      }
    }
    if(r.v==='event') maybeClaim(r.id);

    curKey=key;
    var restore = curKeyChanged ? (scrolls[key]!=null ? scrolls[key] : 0) : app.scrollTop;
    if(r.v==='chat') return;   // chat manages its own scroll (pinned to newest)
    if(curKeyChanged) app.scrollTop = (r.v==='guests'||r.v==='photos') ? 0 : restore;
  }

  /* same view slot, new hash — no extra history entry */
  function swapHash(hash){
    history.replaceState(history.state||{d:0},'',hash);
    render();
  }
  function go(hash){
    var d=(history.state&&history.state.d)||0;
    history.pushState({d:d+1},'',hash);
    render();
  }
  function back(fallback){
    var d=(history.state&&history.state.d)||0;
    if(d>0) history.back();
    else { history.replaceState({d:0},'','#'+fallback); render(); }
  }

  /* ---------- delegated events ---------- */
  document.addEventListener('click',function(e){
    var t=e.target;

    var em=t.closest('[data-evmenu]');
    if(em){
      e.preventDefault(); e.stopPropagation();
      openEventMenu(em);
      return;
    }
    var mi=t.closest('[data-emenu]');
    if(mi){
      /* the menu is parented into the card, which is an <a> */
      e.preventDefault();
      var act=mi.dataset.emenu, mid=menuEvent;
      closeMenu();
      if(act==='edit')   go('#edit/'+mid);
      if(act==='hide')   hideOne(mid);
      if(act==='delete') askDelete(mid);
      if(act==='share')  doShare('event', mid);
      if(act==='link')   copyLink(absUrl('event/'+mid));
      return;
    }

    var sh=t.closest('[data-share-kind]');
    if(sh){ doShare(sh.dataset.shareKind, sh.dataset.shareId); return; }

    var send=t.closest('#msg-send');
    if(send){ sendMsg(send.dataset.event); return; }
    var att=t.closest('#msg-attach');
    if(att){ sendImg(att.dataset.event); return; }

    var addp=t.closest('[data-addphoto]');
    if(addp){
      if(window.D2C && D2C.pickPhoto) D2C.pickPhoto(addp.dataset.addphoto);
      else toast('Connect Firebase to add photos.','err');
      return;
    }

    if(t.closest('[data-cback]')){
      var r0=route();
      if(r0.v==='edit'){ leaveEdit(); return; }
      var st=r0.step;
      if(st>1) swapHash(st===2?'#create':'#create/'+(st-1)); else back('home');
      return;
    }
    if(t.closest('[data-savedraft]')){
      saveEventDraft(); clearDraft();
      toast('Draft saved \u2014 it\u2019s waiting under Hosting');
      homeTab='hosting';
      history.replaceState({d:0},'','#home');
      render(); return;
    }
    var ddel=t.closest('[data-draftdel]');
    if(ddel){
      deleteEventDraft(ddel.dataset.draftdel);
      toast('Draft deleted'); render(); return;
    }
    var dres=t.closest('[data-draft]');
    if(dres){
      if(resumeEventDraft(dres.dataset.draft)) go('#create');
      return;
    }
    if(t.closest('[data-cnext]')){
      var er=draftErrors(loadDraft());
      if(er){ toast(er[0],'err'); var bad=document.getElementById(er[1]); if(bad) bad.focus(); return; }
      saveDraft(); swapHash('#create/2'); return;
    }
    if(t.closest('[data-csave]')){ saveDraft(); swapHash('#create/3'); return; }
    if(t.closest('[data-cnext3]')){ saveDraft(); swapHash('#create/4'); return; }
    if(t.closest('[data-editcancel]')){ leaveEdit(); return; }
    var esave=t.closest('[data-editsave]');
    if(esave){ commitEdit(esave); return; }
    if(t.closest('[data-confirm-yes]')){ var v=confirmFn; closeModal(); if(v) v(); return; }
    if(t.closest('[data-modal-close]') || t===modal){ closeModal(); return; }
    var inv=t.closest('[data-cinvite]');
    if(inv){
      if(!loadMe().name){
        pendingName=function(){ var b=document.querySelector('[data-cinvite]'); if(b) saveEvent(b); };
        modal.innerHTML=nameCard(); modal.hidden=false;
        document.body.classList.add('modal-open');
        return;
      }
      saveEvent(inv); return;
    }
    if(t.closest('[data-cover-pick]')){ pickCover(); return; }
    if(t.closest('[data-cover-remove]')){ dropCover(loadDraft()); return; }
    if(t.closest('[data-map]')){
      var q=draftMapQuery(loadDraft());
      if(!q){ toast('Add a place or address first','err'); return; }
      window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),
                  '_blank','noopener');
      return;
    }
    var g=t.closest('[data-guest]');
    if(g){
      var gd=loadDraft(), gi=gd.invitees.indexOf(g.dataset.guest);
      if(gi>-1) gd.invitees.splice(gi,1); else gd.invitees.push(g.dataset.guest);
      saveDraft(); repaintStep4(); return;
    }
    if(t.closest('[data-gclear]')){
      var cd=loadDraft(); cd.invitees=[]; cd.extra=[];
      saveDraft(); repaintStep4(); return;
    }
    if(t.closest('[data-contacts]')){ importContacts(); return; }
    if(t.closest('[data-vcf]')){
      var vfi=document.getElementById('vcf-input');
      vfi.value='';
      vfi.onchange=function(){ var f=vfi.files&&vfi.files[0]; if(f) importVcf(f); };
      vfi.click(); return;
    }
    if(t.closest('[data-callall]')){
      var cad=loadDraft(),
          cAll=CONTACTS.every(function(c){ return extraAt(cad,c.id)>-1; });
      if(cAll){
        cad.extra=cad.extra.filter(function(e){
          return !CONTACTS.some(function(c){ return c.id===e.id; }); });
      } else {
        CONTACTS.forEach(function(c){
          if(extraAt(cad,c.id)<0)
            cad.extra.push({ id:c.id, name:c.name, phone:c.phone, photo:'', src:'contact' });
        });
      }
      saveDraft(); repaintStep4(); return;
    }
    if(t.closest('[data-addguest]')){ commitAdd(true); return; }

    var face=t.closest('[data-face]');
    if(face){ pickFace(face.dataset.face); return; }

    var unx=t.closest('[data-unextra]');
    if(unx){
      var xd=loadDraft(), xi=extraAt(xd,unx.dataset.unextra);
      if(xi>-1) xd.extra.splice(xi,1);
      saveDraft(); repaintStep4(); return;
    }

    var ct=t.closest('[data-contact]');
    if(ct){
      var td=loadDraft(), ti=extraAt(td,ct.dataset.contact);
      if(ti>-1) td.extra.splice(ti,1);
      else {
        for(var ci=0; ci<CONTACTS.length; ci++) if(CONTACTS[ci].id===ct.dataset.contact){
          var c=CONTACTS[ci];
          td.extra.push({ id:c.id, name:c.name, phone:c.phone, photo:'', src:'contact' });
          break;
        }
      }
      saveDraft(); repaintStep4(); return;
    }

    var gf=t.closest('[data-gfilter]');
    if(gf){ inviteGroup=gf.dataset.gfilter; repaintStep4(); return; }

    var grp=t.closest('[data-group]');
    if(grp){
      var gd=loadDraft(), mem=groupMembers(grp.dataset.group),
          all=mem.length && mem.every(function(id){ return gd.invitees.indexOf(id)>-1; });
      mem.forEach(function(id){
        var at=gd.invitees.indexOf(id);
        if(all){ if(at>-1) gd.invitees.splice(at,1); }
        else if(at<0) gd.invitees.push(id);
      });
      saveDraft(); repaintStep4(); return;
    }

    if(t.closest('[data-sharelink]')){
      toast('Your shareable link is ready as soon as the event is created.','',4000);
      return;
    }

    if(t.closest('[data-mephoto]')){ pickMePhoto(); return; }
    if(t.closest('[data-mesave]')){
      saveMe(); propagateMe(); toast('Profile saved'); repaintProfile();
      checkPhoneLink(); return;
    }
    var padj=t.closest('[data-plusadj]');
    if(padj && !padj.disabled){
      var pid=route().id, pev=findEvent(pid), pm=loadMe();
      var pmax=pev?plusMaxOf(pev):0;

  /* verified: union the views, then settle on one name */
  /* every linked account ends up with ONE name and ONE photo. The newest is
     applied immediately, so closing or skipping the sheet already means
     "keep the most recent" \u2014 the sheet only exists to override that. */
  function applyMerge(name, photo){
    if(name) commonizeName(name);
    if(photo) commonizePhoto(photo);
    saveMe(); propagateMe();
    if(STORE.mode==='live' && window.D2C && D2C.renameLinked)
      D2C.renameLinked(loadMe().cloudLinked||[], loadMe().name, loadMe().photo||'')

  function finishLink(){
    var m=loadMe();
    var seenN={}, seenP={}, names=[], photos=[];
    var profs=[m].concat(linkedProfiles())
      .slice().sort(function(a,b){ return (b.at||0)-(a.at||0); });   /* newest first */
    profs.forEach(function(p){
      if(p.name && !seenN[p.name.toLowerCase()]){
        seenN[p.name.toLowerCase()]=1; names.push({ v:p.name, mine:p.uid===m.uid });
      }
      if(p.photo && !seenP[p.photo]){
        seenP[p.photo]=1; photos.push({ v:p.photo, mine:p.uid===m.uid });
      }
    });
    /* accounts with no photo still offer their default face as an option,
       ranked below every real photo so skipping never discards a real one */
    profs.forEach(function(p){
      if(p.photo) return;
      var d=GAV;
      if(!seenP[d]){ seenP[d]=1; photos.push({ v:d, mine:p.uid===m.uid, def:true }); }
    });
    applyMerge(names.length?names[0].v:'',
               (photos.length && !photos[0].def) ? photos[0].v : '');
    if(names.length>1 || photos.length>1){
      MERGE={ names:names, photos:photos,
              name:names.length?names[0].v:'', photo:photos.length?photos[0].v:'' };
      modal.innerHTML=mergeCard(); modal.hidden=false;

    if(m.name || m.claims[ev.id] || claimShown[ev.id] || ev.role==='hosting') return;

  function doClaim(name, custom){
    var id=route().id, m=loadMe(), ev=findEvent(id);
    if(ev && takenNames(ev)[name.toLowerCase()]){
      toast('Sorry \u2014 '+fname(name)+' is already taken here. Pick another name.','err',4500);
      return;
    }
    m.claims[id]=name;
    if(custom || !m.name) m.name=name;
    if(!custom && ev){
      claimList(ev).forEach(function(g){
        if(g.name===name){
          if(g.phone && !m.phone) m.phone=g.phone;
          if(g.avatarUrl && !m.photo) m.photo=g.avatarUrl;
        }
      });
    }
    if(m.events.indexOf(id)<0) m.events.push(id);
    var pr=pendingRsvp; pendingRsvp=null;
    saveMe(); closeModal();
    if(STORE.mode==='live' && window.D2C && D2C.announceGuest && !m.rsvp[id])
      D2C.announceGuest(id).catch(function(){});
    toast('Welcome, '+fname(name)+'!');
    if(pr && pr.id===id){
      var pb=document.querySelector('#rsvp button[data-k="'+pr.k+'"]');
      if(pb) rsvp(pb);
    }
    /* an adopted number that duplicates an existing account links right away
       (behind the 2FA-style check); otherwise offer the photo/phone follow-up */
    var m2=loadMe();
    if(normPhone(m2.phone) && phoneMatches().length && !phoneVerified()){
