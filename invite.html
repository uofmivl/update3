      clearDraft(); toast('Event created');
      /* depth 0 so the event page's Back behaves like any other event's: home */
      history.replaceState({d:0},'','#event/'+id);
      render();
    }
    function fail(e){
      btn.disabled=false; btn.innerHTML=old;
      toast((e&&e.message)||'Could not save the event','err',5000);
      if(e) console.error(e);
    }
    if(STORE.mode==='live' && window.D2C && D2C.createEvent) D2C.createEvent(d).then(done).catch(fail);
    else { try{ done(createLocalEvent(d)); }catch(e){ fail(e); } }
  }

  /* ---------- share ---------- */
  function doShare(kind, id){
    var ev=findEvent(id); if(!ev) return;
    var url   = absUrl((kind==='album'?'photos/':'event/')+ev.id),
        title = kind==='album' ? 'Photos from '+ev.title : ev.title,
        text  = kind==='album' ? 'Photos from '+ev.title+' on Down2Chill'
                               : 'Join me at '+ev.title+' on Down2Chill';
    if(navigator.share){
      navigator.share({title:title, text:text, url:url}).catch(function(e){
        if(e && e.name==='AbortError') return;      // user dismissed the sheet
        copyLink(url);
      });
      return;
    }
    copyLink(url);
  }
  function copyLink(url){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(function(){ toast('Link copied'); })
        .catch(function(){ toast(url,'err',5000); });
    } else toast(url,'err',5000);
  }

  /* ---------- chat ---------- */
  function scrollThread(){
    requestAnimationFrame(function(){ var a=document.getElementById('app'); a.scrollTop=a.scrollHeight; });
  }
  function sendMsg(id){
    var input=document.getElementById('msg-in');
    if(!input) return;
    var text=input.value.trim(); if(!text) return;
    input.value='';
    if(STORE.mode==='live' && window.D2C && D2C.sendMessage){
      D2C.sendMessage(id, text).catch(function(e){ toast(e.message||'Could not send','err'); });
    } else {
      appendLocalMessage(id, text);
    }
    scrollThread();
  }
  /* a picture message: picked from the OS, uploaded to the chat prefix */
  function sendImg(id){
    var input=document.getElementById('photo-input');
    input.value='';
    input.onchange=function(){
      var file=input.files && input.files[0];
      if(!file) return;
      if(STORE.mode==='live' && window.D2C && D2C.sendImage){
        toast('Sending photo…','wait',0);
        D2C.sendImage(id, file)
          .then(function(){ toast('Photo sent'); scrollThread(); })
          .catch(function(e){ toast(e.message||'Could not send photo','err'); });
      } else {
        appendLocalMessage(id, '', URL.createObjectURL(file));
        scrollThread();
      }
    };
    input.click();
  }

  function closeModal(){
    confirmFn=null; pendingRsvp=null; pendingName=null;
    if(modal.hidden) return;
    modal.hidden=true; modal.innerHTML='';
    document.body.classList.remove('modal-open');
  }

  /* ---------- lightbox ---------- */
  function openLb(id,i){
    lbEvent=findEvent(id); if(!lbEvent || !lbEvent.photos) return;
    lbIdx=i; lb.innerHTML=lightbox(lbEvent,i); lb.hidden=false;
    document.body.classList.add('lb-open');
    var c=lb.querySelector('[data-lb-close]'); if(c) c.focus();
  }
  function stepLb(n){
    if(!lbEvent) return;
    var len=(lbEvent.photos||[]).length; if(!len) return;
    lbIdx=(lbIdx+n+len)%len;
    lb.innerHTML=lightbox(lbEvent,lbIdx);
  }
  function closeLb(){
    if(lb.hidden) return;
    lb.hidden=true; lb.innerHTML=''; lbEvent=null;
    document.body.classList.remove('lb-open');
  }
  /* one loose image (a chat photo) in the same viewer, no arrows */
  function openImgLb(src, by){
    lbEvent=null;
    lb.innerHTML='<div class="lb-bar"><span class="cnt">'+(by?'Photo from '+h(by):'Photo')+'</span>'+
        '<button type="button" data-lb-close aria-label="Close photo">'+ico('x')+'</button></div>'+
      '<div class="lb-stage"><img src="'+h(src)+'" alt="'+(by?'Photo from '+h(by):'Photo')+'"></div>';
    lb.hidden=false;
    document.body.classList.add('lb-open');
    var c=lb.querySelector('[data-lb-close]'); if(c) c.focus();
  }

  /* ---------- drag-to-scroll photo strips ---------- */
  document.addEventListener('pointerdown',function(e){
    var st=e.target.closest('.strip'); if(!st || e.button) return;
    var x0=e.clientX, l0=st.scrollLeft, moved=false;
    function mv(ev){
      var dx=ev.clientX-x0;
      if(!moved && Math.abs(dx)>4){ moved=true; st.classList.add('drag'); }
      if(moved) st.scrollLeft=l0-dx;
    }
    function up(){
      document.removeEventListener('pointermove',mv);
      document.removeEventListener('pointerup',up);
      setTimeout(function(){ st.classList.remove('drag'); },0);
    }
    document.addEventListener('pointermove',mv);
    document.addEventListener('pointerup',up);
  });

  function rsvp(btn){
    var box=btn.parentNode, k=btn.dataset.k, id=route().id,
        cur=box.querySelector('[aria-pressed="true"]');
    if(cur===btn) return;
    var m=loadMe();
    if(!m.name){
      var gev=findEvent(id);
      pendingRsvp={ id:id, k:k };
      if(gev){ modal.innerHTML=claimCard(gev); modal.hidden=false;
               document.body.classList.add('modal-open'); }
      return;
    }
    var prev=m.rsvp[id]||'';
    var n={going:+box.dataset.going, maybe:+box.dataset.maybe, cant:+box.dataset.cant};
    if(cur) n[cur.dataset.k]--;
    n[k]++;
    box.dataset.going=n.going; box.dataset.maybe=n.maybe; box.dataset.cant=n.cant;
    Array.prototype.forEach.call(box.children,function(b){
      b.setAttribute('aria-pressed', String(b===btn)); });
    ['going','maybe','cant'].forEach(function(x){
      var el=document.getElementById('c-'+x); if(el) el.textContent=n[x]; });

    /* remember the answer on this uid and keep the event on my list \u2014
       a "can't go" still stays visible in case you change your mind */
    m.rsvp[id]=k;
    if(m.events.indexOf(id)<0) m.events.push(id);
    saveMe();
    var ev=findEvent(id);
    if(ev) ev.counts={going:n.going, maybe:n.maybe, cant:n.cant};
    var pslot=document.getElementById('plus-slot');
    if(pslot && ev) pslot.innerHTML=plusRowInner(ev);
    if(STORE.mode==='live' && window.D2C && D2C.setRsvp){
      D2C.setRsvp(id, k, prev).catch(function(e){
        toast((e&&e.message)||'Could not save your RSVP','err',4500);
      });
    } else {
      toast(k==='going'?'You\u2019re going!':k==='maybe'?'Marked as maybe':'Marked as can\u2019t go');
    }
  }

  /* ---------- event menu ---------- */
  var menuEvent=null, confirmFn=null;
  function mItem(act,icon,label,danger){
    return '<button type="button" role="menuitem"'+(danger?' class="danger"':'')+
      ' data-emenu="'+act+'">'+ico(icon)+label+'</button>';
  }
  /* Editing and deleting belong to the Hosting tab only. Everywhere else an
     event is somebody else's plan, so the choices are share and hide. */
  function openEventMenu(btn){
    var id=btn.dataset.evmenu, ev=findEvent(id);
    if(!ev) return;
    if(anchor===btn){ closeMenu(); return; }
    closeMenu();
    var onCard = !!btn.closest('.ecard'),
        ctx = onCard ? homeTab
            : ev.role==='hosting' ? 'hosting'
            : ev.dateISO<TODAY ? 'past' : 'upcoming';
    menu.innerHTML =
      ctx==='hosting' ? mItem('edit','pen','Edit event')+
                        mItem('share','net','Share event')+
                        mItem('delete','trash','Delete event',1)
    : ctx==='past'    ? mItem('hide','eye-off','Hide event')
    :                   mItem('share','net','Share event')+
                        mItem('hide','eye-off','Hide event');
    menuEvent=id; anchor=btn; btn.setAttribute('aria-expanded','true');
    placeMenu(btn);
  }
  /* Parked on <body> and positioned against the viewport, so no card can ever
     paint over it and no card can clip it. */
  function placeMenu(btn){
    if(menu.parentNode!==document.body) document.body.appendChild(menu);
    menu.hidden=false;
    menu.style.visibility='hidden';
    var r=btn.getBoundingClientRect(), w=menu.offsetWidth, hgt=menu.offsetHeight,
        left=Math.min(Math.max(10, r.right-w), Math.max(10, window.innerWidth-w-10)),
        top=r.bottom+8;
    if(top+hgt > window.innerHeight-10) top=Math.max(10, r.top-hgt-8);
    menu.style.left=left+'px'; menu.style.top=top+'px'; menu.style.visibility='';
  }

  /* ---------- editing ---------- */
  function leaveEdit(){
    endEdit();
    var id=route().id;
    history.replaceState({d:0},'', id?'#event/'+id:'#home');
    render();
  }
  function commitEdit(btn){
    if(!EDIT) return;
    var id=EDIT.id, patch=settingsPatch(EDIT.draft), old=btn.innerHTML;
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>Saving\u2026';
    function done(){
      endEdit(); toast('Changes saved');
      history.replaceState({d:0},'','#event/'+id); render();
    }
    function fail(e){
      btn.disabled=false; btn.innerHTML=old;
      toast((e&&e.message)||'Could not save the changes','err',5000);
      if(e) console.error(e);
    }
    if(STORE.mode==='live' && window.D2C && D2C.updateEvent) D2C.updateEvent(id,patch).then(done).catch(fail);
    else {
      var ev=STORE.byId[id];
      if(!ev) return fail(new Error('That event is no longer here'));
      for(var k in patch) ev[k]=patch[k];
      done();
    }
  }

  /* ---------- hiding ---------- */
  function hideOne(id){
    var ev=findEvent(id); if(!ev) return;
    hideId(ev);
    toast('Hidden from your events');
    if(route().v!=='home') history.replaceState({d:0},'','#home');
    render();
  }

  /* ---------- deleting ---------- */
  function askDelete(id){
    var ev=findEvent(id); if(!ev) return;
    confirmFn=function(){ doDelete(id); };
    modal.innerHTML=confirmCard('Delete \u201C'+ev.title+'\u201D?',
      'The event, its guest list, photos and chat all go away. This cannot be undone.',
      'Delete event');
    modal.hidden=false;
    document.body.classList.add('modal-open');
    var c=modal.querySelector('[data-confirm-yes]'); if(c) c.focus();
  }
  function doDelete(id){
    var after=function(){
      toast('Event deleted');
      if(route().v!=='home'){ history.replaceState({d:0},'','#home'); }
      render();
    };
    if(STORE.mode==='live' && window.D2C && D2C.deleteEvent){
      toast('Deleting\u2026','wait',0);
      D2C.deleteEvent(id).then(after).catch(function(e){
        toast((e&&e.message)||'Could not delete the event','err',5000);
      });
      return;
    }
    STORE.setEvents(STORE.events.filter(function(e){ return e.id!==id; }));
    after();
  }

  function closeMenu(){
    menu.hidden=true;
    /* park it back on <body> — its last parent may be about to be re-rendered */
    if(menu.parentNode!==document.body) document.body.appendChild(menu);
    if(anchor){ anchor.setAttribute('aria-expanded','false'); anchor=null; }
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closeMenu(); closeLb(); closeModal(); }
    if(lbEvent){
      if(e.key==='ArrowRight') stepLb(1);
      if(e.key==='ArrowLeft')  stepLb(-1);
    }
  });

  function loadingView(){
    return '<div class="wrap"><header class="top"></header>'+
      '<h1 class="title">Events</h1><p class="skel">Loading events\u2026</p></div>';
  }

  /* Any store change — first load, a new event, an edited doc, a subcollection
     arriving — repaints the current view in place. */
  STORE.onChange(function(){
    var rv=route().v;
    /* never repaint over a half-filled form — but an edit still needs the
       first load, since it cannot open before its event exists */
    if(rv==='create'||(rv==='edit'&&EDIT)) return;
    var y=app.scrollTop;
    render();
    app.scrollTop=y;
  });

  /* the other device keeps opening events after we linked — pull the fresh
     union when the app boots and whenever this tab comes back into view */
  var lastSync=0;
  function syncLinks(){
    if(STORE.mode!=='live' || !phoneVerified()) return;
    var now=Date.now();
    if(now-lastSync<60000) return;
    lastSync=now; saveMe();
  }
  STORE.onChange(function(){ if(STORE.mode==='live') syncLinks(); });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) syncLinks();
  });

  if(location.hash==='#vpdebug'){
    (function(){
      var probe=function(u){
        var d=document.createElement('div');
        d.style.cssText='position:absolute;visibility:hidden;height:100'+u;
        document.body.appendChild(d);
        var v=Math.round(d.getBoundingClientRect().height); d.remove(); return v;
      };
      var mark=function(parent,color){
        var d=document.createElement('div');
        d.style.cssText='position:fixed;left:0;right:0;bottom:0;height:5px;background:'+color+';z-index:998';
        parent.appendChild(d);
      };
      mark(document.body,'red');                             /* browser fixed viewport */
      mark(document.getElementById('shell'),'lime');         /* shell bottom */
      var dbg=document.createElement('div');
      dbg.style.cssText='position:fixed;top:70px;left:8px;z-index:999;background:rgba(0,0,0,.82);'+
        'color:#7CFC00;font:12px/1.6 monospace;padding:10px 12px;border-radius:10px;white-space:pre';
      document.body.appendChild(dbg);
      function upd(){
        var vv=window.visualViewport;
        dbg.textContent=
          'innerH  '+window.innerHeight+
          '\nclientH '+document.documentElement.clientHeight+
          '\nvv.h    '+(vv?vv.height.toFixed(1):'n/a')+'  off '+(vv?vv.offsetTop:'-')+
          '\nsvh '+probe('svh')+'  dvh '+probe('dvh')+'  lvh '+probe('lvh')+
          '\nscreen  '+screen.height+'  avail '+screen.availHeight+
          '\nshellH  '+Math.round(document.getElementById('shell').getBoundingClientRect().height);
      }
      upd(); setInterval(upd,800);
    })();
  }

  window.addEventListener('scroll',function(){ if(!menu.hidden) closeMenu(); },true);
  window.addEventListener('resize',function(){ if(!menu.hidden) closeMenu(); });
  window.addEventListener('popstate',render);
  window.addEventListener('hashchange',render);
  if(!history.state) history.replaceState({d:0},'',location.hash||'#home');
  render();
})();
</script>

<script type="module">
/* =====================================================================
   FIREBASE  —  fill in apiKey and the WEB appId below.
   Your pasted appId ended in ":ios:" which the JS SDK cannot use.
   Firebase Console -> Project settings -> General -> Your apps
     -> Add app -> Web  ->  copy apiKey + appId from that config.
   ===================================================================== */
const FB_CONFIG = {
  apiKey:            "__FIREBASE_API_KEY__",               // substituted at build time
  authDomain:        "down2chill-cc664.firebaseapp.com",
  projectId:         "down2chill-cc664",
  storageBucket:     "down2chill-cc664.appspot.com",
  messagingSenderId: "202068437157",
  appId:             "__FIREBASE_APP_ID__"                 // substituted at build time
};

/* A placeholder is a non-empty string, so a plain truthiness test would treat
   an unsubstituted build as configured. These check for real values.        */
const KEY_OK = !!FB_CONFIG.apiKey && !FB_CONFIG.apiKey.startsWith("__");
const APP_OK = /:web:/.test(FB_CONFIG.appId || "");
const UNSUBBED = (v) => (v || "").startsWith("__");

const SDK = "https://www.gstatic.com/firebasejs/12.3.0/";
/* Namespacing — this bucket/database already hold other data, so everything
   this app writes lives under one prefix and nothing else is touched.
     Firestore : apps/down2chill/{events,people}/...
     Storage   : down2chill/events/{eventId}/photos/...  (event albums)
                 down2chill/chat/{eventId}/...           (chat pictures)   */
const FS_ROOT    = ["apps", "down2chill"];
const PHOTO_ROOT = "down2chill/events";
const COVER_ROOT = "down2chill/covers";
const CHAT_ROOT  = "down2chill/chat";

let fb = null;      // { app, db, storage, auth, uid, api:{...} }

/* ---------------- logging ---------------- */
function logEl(){ return document.getElementById("fb-log"); }
function log(msg, cls){
  const el = logEl(); if(!el) return;
  if(el.querySelector(".dim") && el.children.length === 1 && el.textContent === "Ready.") el.textContent = "";
  const line = document.createElement("div");
  if(cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function ok(m){ log("\u2713 " + m, "ok"); }
function err(m){ log("\u2717 " + m, "err"); }
function warn(m){ log("! " + m, "warn"); }
function dim(m){ log(m, "dim"); }

/* ---------------- init ---------------- */
async function initFirebase(){
  if(fb) return fb;
  if(!KEY_OK) throw new Error(UNSUBBED(FB_CONFIG.apiKey)
    ? "apiKey is still the build placeholder — Cloudflare did not substitute it."
    : "apiKey is blank — set FB_CONFIG.apiKey.");

  const [{ initializeApp }, fs, st, au] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-firestore.js"),
    import(SDK + "firebase-storage.js"),
    import(SDK + "firebase-auth.js")
  ]);

  const app     = initializeApp(FB_CONFIG);
  const db      = fs.getFirestore(app);
  const storage = st.getStorage(app);
  const auth    = au.getAuth(app);

  // Anonymous sign-in is optional. If it's not enabled, keep going —
  // it only matters when your rules require request.auth != null.
  let uid = null;
  try {
    const cred = await au.signInAnonymously(auth);
    uid = cred.user.uid;
    dim("signed in anonymously as " + uid.slice(0, 10) + "\u2026");
  } catch(e){
    warn("anonymous auth unavailable (" + e.code + ") — continuing unauthenticated");
  }

  fb = { app, db, storage, auth, uid, fs, st };
  return fb;
}

/* ---------------- connection panel ---------------- */
function renderConn(){
  const box = document.getElementById("fb-conn");
  if(!box) return;
  const rows = [
    ["projectId", FB_CONFIG.projectId, !!FB_CONFIG.projectId],
    ["bucket",    FB_CONFIG.storageBucket, !!FB_CONFIG.storageBucket],
    ["apiKey",    KEY_OK ? "set \u2713"
                  : UNSUBBED(FB_CONFIG.apiKey) ? "PLACEHOLDER — build did not substitute"
                  : "MISSING", KEY_OK],
    ["appId",     APP_OK ? "web app \u2713"
                  : UNSUBBED(FB_CONFIG.appId) ? "PLACEHOLDER — build did not substitute"
                  : FB_CONFIG.appId ? "NOT a web appId (must contain :web:)"
                  : "MISSING", APP_OK],
    ["origin",    location.protocol === "file:" ? "file:// — serve over http instead" : location.origin,
                  location.protocol !== "file:"],
    ["firestore",  FS_ROOT.join("/") + "/events", true],
    ["storage",    PHOTO_ROOT + "/", true],
    ["chat imgs",  CHAT_ROOT + "/", true]
  ];
  box.innerHTML = rows.map(r =>
    '<div class="fb-kv ' + (r[2] ? "good" : "bad") + '"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'
  ).join("");
}

/* ---------------- 1. seed ---------------- */
function eventDoc(ev, fsId, hostFsId){
  return {
    uid: fsId,                         // Firestore's own document id, mirrored into the doc
    slug: ev.id,                       // stable authored key — what upserts match on
    title: ev.title, titleLower: ev.title.toLowerCase(),
    dateISO: ev.date, time: ev.time, timeSort: t24(ev.time),
    venue: ev.venue, address: ev.address, about: ev.about,
    vibe: ev.vibe, capacity: ev.capacity, entry: ev.entry, inviteType: ev.invite,
    dot: ev.dot, role: ev.role,
    coverPath: "", coverUrl: IMG(ev.img, 1000, 1250),
    thumbUrl: IMG(ev.img, 400, 440),
    mapPath: "",  mapUrl: IMG(ev.map, 1200, 675),
    hostUid: hostFsId, hostName: pn(ev.hostId), hostAvatarUrl: pav(ev.hostId),
    counts: { going: ev.going, maybe: ev.maybe, cant: ev.cant, pending: ev.pending },
    guestPreview: ev.guests.slice(0, 5).map(g => ({
      uid: PERSON[g.id].fsId, name: pn(g.id), avatarUrl: pav(g.id), isHost: !!g.host
    })),
    photoCount: ev.photoCount, lastPhotoLabel: ev.photoWhen,
    /* Chat is an array on the event document — realtime via the event
       listener, no extra subcollection or listener needed. */
    chatMessages: ev.thread.map(m => ({
      fromUid: PERSON[m.from].fsId || "", fromName: pn(m.from), fromAvatarUrl: pav(m.from),
      text: m.text, at: new Date(Date.now() - m.minsAgo * 60000).toISOString(),
      isYou: m.from === "emily"
    })),
    chatUnread: ev.chat.unread || 0,
    seededAt: new Date().toISOString()
  };
}

async function seed(){
  const { db, fs } = await initFirebase();
  const { doc, collection, getDocs, query, where, limit, writeBatch } = fs;

  let batch = writeBatch(db), n = 0, total = 0;
  const flush = async (force) => {
    if(n >= 400 || (force && n > 0)){ await batch.commit(); batch = writeBatch(db); total += n; n = 0; }
  };
  const put = async (ref, data) => { batch.set(ref, data); n++; await flush(false); };
  const drop = async (ref) => { batch.delete(ref); n++; await flush(false); };

  /* Firestore generates every document id. To stay idempotent we look up the
     existing doc by its authored slug/handle and reuse that id; only genuinely
     new records get a fresh auto-id. Re-running can never duplicate.          */
  const idFor = async (colRef, field, value) => {
    const hit = await getDocs(query(colRef, where(field, "==", value), limit(1)));
    return hit.empty ? doc(colRef).id : hit.docs[0].id;
  };

  // ---- people ----
  dim("resolving people\u2026");
  const peopleCol = collection(db, ...FS_ROOT, "people");
  for(const p of SEED_PEOPLE){
    p.fsId = await idFor(peopleCol, "handle", p.id);
    await put(doc(peopleCol, p.fsId), {
      uid: p.fsId, handle: p.id, name: p.name, nameLower: p.name.toLowerCase(),
      avatarUrl: AV(p.avatar), avatarPath: ""
    });
  }
  await flush(true);
  ok("people: " + SEED_PEOPLE.length + " docs");

  // ---- events ----
  const eventsCol = collection(db, ...FS_ROOT, "events");
  for(const ev of SEED_EVENTS){
    ev.fsId = await idFor(eventsCol, "slug", ev.id);
    const evRef = doc(eventsCol, ev.fsId);
    dim(ev.title + " \u2192 " + ev.fsId);

    await put(evRef, eventDoc(ev, ev.fsId, PERSON[ev.hostId].fsId));

    // guests are keyed by the person's Firestore id, so they're upserts too
    for(const g of ev.guests)
      await put(doc(evRef, "guests", PERSON[g.id].fsId), {
        personUid: PERSON[g.id].fsId, eventUid: ev.fsId, status: "going",
        name: pn(g.id), avatarUrl: pav(g.id),
        message: g.msg || "", invitedLabel: g.when, isHost: !!g.host, isYou: !!g.you
      });
    for(const g of ev.waiting)
      await put(doc(evRef, "guests", PERSON[g.id].fsId), {
        personUid: PERSON[g.id].fsId, eventUid: ev.fsId, status: "pending",
        name: pn(g.id), avatarUrl: pav(g.id),
        message: "", invitedLabel: g.when, isHost: false, isYou: false
      });

    /* photos / activity / messages have no natural key, so they get pure
       auto-ids. Clear the previously seeded ones first — uploads are kept. */
    for(const sub of ["photos", "activity", "messages"]){   // "messages" clears the old subcollection
      const existing = await getDocs(query(collection(evRef, sub), where("source", "==", "seed")));
      for(const d of existing.docs) await drop(d.ref);
    }

    for(let i = 0; i < ev.allPhotos.length; i++){
      const ph = ev.allPhotos[i];
      await put(doc(collection(evRef, "photos")), {
        eventUid: ev.fsId, path: "", url: IMG(ph.seed, 1400, 1400), thumbUrl: IMG(ph.seed, 600, 600),
        byUid: PERSON[ph.byId].fsId, byName: pn(ph.byId), byAvatarUrl: pav(ph.byId),
        whenLabel: ph.when,
        /* sort key is DESCENDING — highest is newest. Seeds count down from the
           list length; uploads use Date.now(), which always outranks them.   */
        order: ev.allPhotos.length - i, source: "seed"
      });
    }
    for(let i = 0; i < ev.activity.length; i++){
      const a = ev.activity[i];
      await put(doc(collection(evRef, "activity")), {
        eventUid: ev.fsId, personUid: PERSON[a.id].fsId, personName: pn(a.id),
        icon: a.ic, isCheck: !!a.ok, text: a.txt, whenLabel: a.t, order: i, source: "seed"
      });
    }
  }

  await flush(true);
  ok("seeded " + SEED_EVENTS.length + " events \u2014 " + total + " writes, all ids from Firestore");
  if(STORE.mode !== "live") await connectLive();
  dim("pool-party document id = " + SEED_BY_ID["pool-party"].fsId);
  const sel = document.getElementById("fb-ev");
  if(sel) Array.from(sel.options).forEach(o => { const e = SEED_BY_ID[o.dataset.local]; if(e) o.value = e.fsId; });
}

/* the signed-in visitor, shaped like the old hardcoded person */
function meIdent(){
  const m = window.loadMe ? loadMe() : { uid: "", name: "" };
  return { fsId: m.uid || "", name: m.name || "Guest", av: window.meAvatar ? meAvatar() : "" };
}

/* ---------------- 2. upload ---------------- */
/* Shared by the debug panel and the in-app "Add Photo" buttons. */
async function uploadPhoto(evId, file, say){
  say = say || dim;
  const { db, storage, fs, st } = await initFirebase();
  if(!evId) throw new Error("No event id — run step 1 first.");
  if(!file) throw new Error("Choose an image file first.");
  if(!/^image\//.test(file.type)) throw new Error("That file isn\u2019t an image.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB \u2014 the limit is 25 MB.");

  const safe = file.name.replace(/[^\w.\-]+/g, "_");
  const path = PHOTO_ROOT + "/" + evId + "/photos/" + Date.now() + "_" + safe;
  say("uploading " + (file.size / 1024).toFixed(0) + " KB to " + path);

  const ref  = st.ref(storage, path);
  await st.uploadBytes(ref, file, { contentType: file.type });
  const url  = await st.getDownloadURL(ref);

  const me = meIdent();
  const photoRef = fs.doc(fs.collection(db, ...FS_ROOT, "events", evId, "photos"));
  await fs.setDoc(photoRef, {
    path, url, thumbUrl: url, eventUid: evId,
    byUid: me.fsId || "", byName: me.name, byAvatarUrl: me.av,
    whenLabel: "Just now",
    order: Date.now(), source: "upload", uploadedAt: fs.serverTimestamp()
  });
  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", evId), { photoCount: fs.increment(1) });
  return { url, path, id: photoRef.id };
}

/* debug-panel version: reads the <select> + <input type=file> */
async function upload(){
  const input = document.getElementById("fb-file");
  const sel   = document.getElementById("fb-ev");
  const local = SEED_BY_ID[sel.selectedOptions[0].dataset.local];
  const evId  = local && local.fsId ? local.fsId : sel.value;
  if(!local || !local.fsId)
    throw new Error("Run step 1 first \u2014 the event has no Firestore id yet in this session.");

  const r = await uploadPhoto(evId, input.files && input.files[0]);
  ok("uploaded to Storage");
  ok("download URL resolved");
  dim(r.url);
  ok("Firestore photo doc created: " + FS_ROOT.join("/") + "/events/" + evId + "/photos/" + r.id);
  ok("photoCount incremented on " + FS_ROOT.join("/") + "/events/" + evId);

}

/* in-app version: opens the OS file picker for a given event */
function pickPhoto(eventId){
  if(STORE.mode !== "live"){
    toast("Connect Firebase to add photos.", "err");
    return;
  }
  const input = document.getElementById("photo-input");
  input.value = "";
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if(!file) return;
    toast("Uploading photo\u2026", "wait", 0);
    try {
      await uploadPhoto(eventId, file, () => {});
      toast("Photo added");          // the live listener repaints the grid itself
    } catch(e){
      toast(e.message || "Upload failed", "err");
    }
  };
  input.click();
}

/* ---------------- 3. read tests ---------------- */
async function testReads(){
  const { db, storage, fs, st } = await initFirebase();
  let pass = 0, fail = 0;
  const step = async (label, fn) => {
    try { const r = await fn(); ok(label + (r ? " \u2014 " + r : "")); pass++; }
    catch(e){ err(label + " \u2014 " + (e.code || "") + " " + e.message); fail++; }
  };

  await step("Firestore: list events", async () => {
    const snap = await fs.getDocs(fs.query(fs.collection(db, ...FS_ROOT, "events"), fs.limit(50)));
    if(snap.empty) throw new Error("collection is empty — run step 1 first");
    return snap.size + " docs (" + snap.docs.slice(0, 3).map(d => d.data().title).join(", ") + "\u2026)";
  });

  await step("Firestore: ordered query (dateISO)", async () => {
    const snap = await fs.getDocs(fs.query(fs.collection(db, ...FS_ROOT, "events"),
                   fs.orderBy("dateISO"), fs.limit(3)));
    return snap.docs.map(d => d.data().dateISO).join(" \u2192 ");
  });

  await step("Firestore: read one event doc", async () => {
    const id = SEED_BY_ID["pool-party"].fsId;
    if(!id) throw new Error("run step 1 first (no Firestore id for pool-party yet)");
    const d = await fs.getDoc(fs.doc(db, ...FS_ROOT, "events", id));
    if(!d.exists()) throw new Error("events/" + id + " missing");
    const v = d.data();
    return v.title + " @ " + v.venue + ", " + v.counts.going + " going";
  });

  await step("Firestore: read subcollection (guests)", async () => {
    const snap = await fs.getDocs(fs.collection(db, ...FS_ROOT, "events", SEED_BY_ID["pool-party"].fsId, "guests"));
    return snap.size + " guest docs";
  });

  // The app never crawls the bucket — it reads a path from Firestore and resolves it.
  // That is what we test here; a listAll() is only a coarse extra diagnostic.
  let firstUrl = null, firstPath = null;

  await step("Firestore: find an uploaded photo", async () => {
    const id = SEED_BY_ID["pool-party"].fsId;
    if(!id) throw new Error("run step 1 first");
    const snap = await fs.getDocs(fs.query(
      fs.collection(db, ...FS_ROOT, "events", id, "photos"),
      fs.where("source", "==", "upload"), fs.limit(1)));
    if(snap.empty) throw new Error("no uploaded photos on Pool Party yet — run step 2 first");
    const d = snap.docs[0].data();
    firstPath = d.path; firstUrl = d.url;
    return d.path;
  });

  if(firstPath){
    await step("Storage: resolve stored path", async () => {
      firstUrl = await st.getDownloadURL(st.ref(storage, firstPath));
      return "URL resolved from Firestore path";
    });
    await step("Browser: load that image", () => new Promise((res, rej) => {
      const im = new Image();
      im.onload  = () => res(im.naturalWidth + "\u00D7" + im.naturalHeight + " px");
      im.onerror = () => rej(new Error("image failed to load (check Storage read rule)"));
      im.src = firstUrl;
    }));
  }

  await step("Storage: list prefix (optional)", async () => {
    const res = await st.listAll(st.ref(storage, PHOTO_ROOT));
    return res.prefixes.length + " event folder(s), " + res.items.length + " loose file(s)";
  });

  log("");
  (fail ? warn : ok)("read tests finished — " + pass + " passed, " + fail + " failed");
}

/* ---------------- 4. create an event ---------------- */
/* Cover photos live beside the event photos but in their own prefix, so a
   cover picked before the event exists still has somewhere to go.          */
async function uploadCover(file, onProgress){
  const { storage, st } = await initFirebase();
  if(!file) throw new Error("Choose an image first.");
  if(!/^image\//.test(file.type)) throw new Error("That file isn\u2019t an image.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB \u2014 the limit is 25 MB.");

  const safe = file.name.replace(/[^\w.\-]+/g, "_");
  const path = COVER_ROOT + "/" + Date.now() + "_" + safe;
  const ref  = st.ref(storage, path);

  if(st.uploadBytesResumable){
    await new Promise((resolve, reject) => {
      const task = st.uploadBytesResumable(ref, file, { contentType: file.type });
      task.on("state_changed",
        s => { if(onProgress && s.totalBytes) onProgress(s.bytesTransferred / s.totalBytes); },
        reject, resolve);
    });
  } else {
    await st.uploadBytes(ref, file, { contentType: file.type });
  }
  const url = await st.getDownloadURL(ref);
  dim("cover uploaded to " + path);
  return { url, path };
}

/* Writes the event document plus the host's own guest row and the opening
   activity entry. The events listener picks it up and the new card appears
   on Home by itself.                                                       */
async function createEvent(draft){
  const { db, fs } = await initFirebase();
  const me    = meIdent();
  const evRef = fs.doc(fs.collection(db, ...FS_ROOT, "events"));
  const data  = draftDoc(draft, evRef.id, me.fsId || "");
  data.createdAt = fs.serverTimestamp();

  await fs.setDoc(evRef, data);
  await fs.setDoc(fs.doc(fs.collection(evRef, "guests")), {
    uid: me.fsId || "", name: me.name, avatarUrl: me.av, message: "",
    invitedLabel: "Just now", isHost: true, isYou: true, status: "going",
    order: Date.now(), source: "created"
  });
  /* everyone picked on step 4 starts as a pending guest */
  const invited = invitedList(draft);
  await Promise.all(invited.map((g, i) =>
    fs.setDoc(fs.doc(fs.collection(evRef, "guests")), {
      uid: g.uid, name: g.name, avatarUrl: g.avatarUrl, phone: g.phone, message: "",
      invitedLabel: "Just now", isHost: false, isYou: false, status: "pending",
      order: Date.now() + i + 1, source: g.source
    })));
  await fs.setDoc(fs.doc(fs.collection(evRef, "activity")), {
    personName: me.name, personAvatarUrl: me.av, icon: "check", isCheck: true,
    text: "created this event", whenLabel: "Just now",
    order: Date.now(), source: "created"
  });
  ok("event created: " + FS_ROOT.join("/") + "/events/" + evRef.id +
     " with " + invited.length + " invited");
  return evRef.id;
}

/* ---------------- 5. edit / delete ---------------- */
async function updateEvent(id, patch){
  const { db, fs } = await initFirebase();
  patch = Object.assign({}, patch, { updatedAt: fs.serverTimestamp() });
  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", id), patch);
  ok("event updated: " + FS_ROOT.join("/") + "/events/" + id);
}

/* Firestore does not cascade, so the subcollections go first. */
async function deleteEvent(id){
  const { db, storage, fs, st } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", id);

  let cover = "";
  try { const snap = await fs.getDoc(evRef); cover = (snap.data() || {}).coverPath || ""; }
  catch(e){ /* the doc may already be gone */ }

  for(const sub of ["guests", "photos", "activity"]){
    const snap = await fs.getDocs(fs.collection(evRef, sub));
    await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
  }
  await fs.deleteDoc(evRef);

  if(cover){
    try { await st.deleteObject(st.ref(storage, cover)); }
    catch(e){ warn("cover not removed (" + (e.code || e.message) + ")"); }
  }
  ok("event deleted: " + FS_ROOT.join("/") + "/events/" + id);
}

/* ---------------- one name across linked accounts ---------------- */
async function renameLinked(profiles, name, photo){
  const { db, fs } = await initFirebase();
  const vPatch = photo ? { name, photo } : { name };
  const gPatch = photo ? { name, avatarUrl: photo } : { name };
  for(const p of profiles){
    await fs.setDoc(fs.doc(db, ...FS_ROOT, "visitors", p.uid), vPatch, { merge: true });
    const evs = await fs.getDocs(fs.query(
      fs.collection(db, ...FS_ROOT, "events"), fs.where("hostUid", "==", p.uid)));
    const ePatch = photo ? { hostName: name, hostAvatarUrl: photo } : { hostName: name };
    await Promise.all(evs.docs.map(d => fs.updateDoc(d.ref, ePatch)));
    await Promise.all(Object.keys(p.rsvp || {}).map(id =>
      fs.setDoc(fs.doc(db, ...FS_ROOT, "events", id, "guests", p.uid),
        gPatch, { merge: true }).catch(() => {})));
  }
  ok("profile commonized across " + profiles.length + " linked account(s)");
}

/* ---------------- how many extras a guest brings ---------------- */
async function setPlus(eventId, n){
  const { db, fs } = await initFirebase();
  const me = meIdent();
  await fs.setDoc(fs.doc(db, ...FS_ROOT, "events", eventId, "guests", me.fsId || "anon"),
    { plus: n }, { merge: true });
}

/* ---------------- a named viewer joins the waiting list ---------------- */
async function announceGuest(eventId){
  const { db, fs } = await initFirebase();
  const me = meIdent();
  await fs.setDoc(fs.doc(db, ...FS_ROOT, "events", eventId, "guests", me.fsId || "anon"), {
    uid: me.fsId, name: me.name, avatarUrl: me.av, message: "",
    invitedLabel: "Viewing this event", isHost: false, isYou: false,
    status: "pending", order: Date.now(), source: "visit"
  }, { merge: true });
}

/* ---------------- profile propagation ---------------- */
async function propagateProfile(p){
  const { db, fs } = await initFirebase();
  const evs = await fs.getDocs(fs.query(
    fs.collection(db, ...FS_ROOT, "events"), fs.where("hostUid", "==", p.uid)));
  await Promise.all(evs.docs.map(d =>
    fs.updateDoc(d.ref, { hostName: p.name, hostAvatarUrl: p.avatarUrl })));
  await Promise.all(Object.keys(p.rsvp || {}).map(id =>
    fs.setDoc(fs.doc(db, ...FS_ROOT, "events", id, "guests", p.uid),
      { name: p.name, avatarUrl: p.avatarUrl }, { merge: true }).catch(() => {})));
  ok("profile propagated to " + evs.size + " hosted event(s) and " +
     Object.keys(p.rsvp || {}).length + " RSVP(s)");
}

/* ---------------- RSVP ----------------
   One guests doc per visitor uid, so re-answering overwrites instead of
   piling up rows, and the counts move by increments on the event doc.   */
async function setRsvp(eventId, status, prev){
  const { db, fs } = await initFirebase();
  const me = meIdent();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  await fs.setDoc(fs.doc(evRef, "guests", me.fsId || "anon"), {
    uid: me.fsId, name: me.name, avatarUrl: me.av, message: "",
    invitedLabel: "Responded just now", isHost: false, isYou: false,
    status: status, order: Date.now(), source: "rsvp",
    plus: (window.loadMe && loadMe().plus[eventId]) || 0
  }, { merge: true });
  const inc = {};
  inc["counts." + status] = fs.increment(1);
  if(prev && prev !== status) inc["counts." + prev] = fs.increment(-1);
  await fs.updateDoc(evRef, inc);
}

/* ---------------- 6. visitor profiles ---------------- */
async function saveProfile(p){
  const { db, fs } = await initFirebase();
  await fs.setDoc(fs.doc(db, ...FS_ROOT, "visitors", p.uid),
    Object.assign({}, p, { updatedAt: fs.serverTimestamp() }), { merge: true });
}
async function findByPhone(phone){
  const { db, fs } = await initFirebase();
  const snap = await fs.getDocs(fs.query(
    fs.collection(db, ...FS_ROOT, "visitors"), fs.where("phone", "==", phone)));
  return snap.docs.map(d => d.data());
}

/* ---------------- live data ---------------- */
let unsubEvents = null, unsubDetail = [], watchingId = null;

async function connectLive(){
  if(!KEY_OK){
    useLocalData(UNSUBBED(FB_CONFIG.apiKey)
      ? "Build placeholder not substituted — showing bundled sample data."
      : "Firebase not configured — showing bundled sample data.");
    return;
  }
  try {
    const { db, fs } = await initFirebase();
    // Every event document, ordered by date, streamed continuously.
    unsubEvents = fs.onSnapshot(
      fs.query(fs.collection(db, ...FS_ROOT, "events"), fs.orderBy("dateISO")),
      snap => {
        STORE.setEvents(snap.docs.map(d => docToModel(d.id, d.data())), "live");
        dim("events snapshot: " + snap.size + " docs" +
            (snap.metadata.fromCache ? " (cache)" : ""));
        if(watchingId) watchDetail(watchingId);   // re-attach if the doc set changed
      },
      e => { err("events listener: " + e.code); useLocalData("Firestore read failed (" + e.code + ")."); }
    );
  } catch(e){
    useLocalData("Firebase init failed: " + e.message);
  }
}

/* Subcollections stream only while a detail view is open. */
async function watchDetail(id){
  const ev = findEvent(id);
  if(!ev) return;
  if(STORE.mode === "local"){ if(ev._seed) STORE.setDetail(id, seedDetail(ev)); return; }

  const { db, fs } = await initFirebase();
  const base = [db, ...FS_ROOT, "events", ev.id];

  unsubDetail.push(fs.onSnapshot(fs.collection(...base, "guests"), snap => {
    const all = snap.docs.map(d => d.data());
    STORE.setDetail(id, {
      guests:  all.filter(g => g.status === "going").map(mapGuest),
      maybes:  all.filter(g => g.status === "maybe").map(mapGuest),
      cants:   all.filter(g => g.status === "cant").map(mapGuest),
      waiting: all.filter(g => g.status === "pending").map(mapGuest)
    });
  }, e => err("guests: " + e.code)));

  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "photos"), fs.orderBy("order", "desc")),
    snap => STORE.setDetail(id, { photos: snap.docs.map(d => {
      const p = d.data();
      return { url: p.url, thumbUrl: p.thumbUrl || p.url, byName: p.byName || "Someone",
               byAvatarUrl: p.byAvatarUrl || "", whenLabel: p.whenLabel || "" };
    })}), e => err("photos: " + e.code)));

  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "activity"), fs.orderBy("order")),
    snap => STORE.setDetail(id, { activity: snap.docs.map(d => {
      const a = d.data();
      return { personName: a.personName || "Someone", personAvatarUrl: a.personAvatarUrl || "",
               icon: a.icon || "check", isCheck: !!a.isCheck, text: a.text || "",
               whenLabel: a.whenLabel || "", quote: /^[\u201C"]/.test(a.text || "") };
    })}), e => err("activity: " + e.code)));
}

function mapGuest(g){
  return { name: g.name || "Guest", avatarUrl: g.avatarUrl || "", message: g.message || "",
           invitedLabel: g.invitedLabel || "", isHost: !!g.isHost, isYou: !!g.isYou,
           status: g.status || "going", uid: g.uid || "", source: g.source || "",
           plus: g.plus || 0 };
}

function stopDetail(){ unsubDetail.forEach(u => { try{ u(); }catch(e){} }); unsubDetail = []; }

async function sendMessage(eventId, text){
  const { db, fs } = await initFirebase();
  const me = meIdent();
  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", eventId), {
    chatMessages: fs.arrayUnion({
      fromUid: me.fsId || "", fromName: me.name, fromAvatarUrl: me.av,
      text: text, at: new Date().toISOString(), isYou: true
    })
  });
}

/* A picture message. The file lives under its own storage prefix (CHAT_ROOT),
   apart from the event photo albums, and the message rides the same
   chatMessages array with an imageUrl instead of text. */
async function sendImage(eventId, file){
  const { db, storage, fs, st } = await initFirebase();
  if(!eventId) throw new Error("No event id.");
  if(!file) throw new Error("Choose an image file first.");
  if(!/^image\//.test(file.type)) throw new Error("That file isn’t an image.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB — the limit is 25 MB.");

  const safe = file.name.replace(/[^\w.\-]+/g, "_");
  const path = CHAT_ROOT + "/" + eventId + "/" + Date.now() + "_" + safe;
  const ref  = st.ref(storage, path);
  await st.uploadBytes(ref, file, { contentType: file.type });
  const url  = await st.getDownloadURL(ref);

  const me = meIdent();
  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", eventId), {
    chatMessages: fs.arrayUnion({
      fromUid: me.fsId || "", fromName: me.name, fromAvatarUrl: me.av,
      text: "", imageUrl: url, imagePath: path,
      at: new Date().toISOString(), isYou: true
    })
  });
  return { url, path };
}

window.D2C = {
  pickPhoto, sendMessage, sendImage, uploadCover, createEvent, updateEvent, deleteEvent,
  saveProfile, findByPhone, setRsvp, setPlus, propagateProfile, announceGuest, renameLinked,
  watchEvent(id){ watchingId = id; stopDetail(); watchDetail(id); },
  unwatchEvent(){ watchingId = null; stopDetail(); },
  reconnect: connectLive
};

/* ---------------- wiring ---------------- */
function run(btn, label, fn){
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  Promise.resolve()
    .then(fn)
    .catch(e => { err((e.code ? e.code + " — " : "") + e.message); console.error(e); })
    .finally(() => { btn.disabled = false; btn.textContent = old; });
}

document.addEventListener("click", e => {
  const t = e.target.closest("#fb-seed, #fb-upload, #fb-test");
  if(!t) return;
  if(t.id === "fb-seed")   run(t, "Seeding\u2026",   () => seed(t));
  if(t.id === "fb-upload") run(t, "Uploading\u2026", upload);
  if(t.id === "fb-test")   run(t, "Testing\u2026",   testReads);
});

// The debug view is rendered by the router; refresh the panel whenever it appears.
new MutationObserver(() => { if(document.getElementById("fb-conn")) renderConn(); })
  .observe(document.getElementById("app"), { childList: true });
if(document.getElementById("fb-conn")) renderConn();

// Start streaming (or fall back to bundled data if the key is missing).
connectLive();
